name: Deploy site (combined)

# Builds every published branch into ONE GitHub Pages artifact:
#   main -> dist/      -> twosides.earth
#   dev  -> dist/dev/  -> twosides.earth/dev
#   moma -> dist/moma/ -> twosides.earth/moma   (the exhibition build)
#
# This file is the single source of truth and lives only on `main`.
# `repository_dispatch` and `workflow_dispatch` always run the workflow file
# from the default branch, so a push to `dev` fires the ping in
# .github/workflows/trigger-deploy.yml (on `dev`) and this file does the work.
# Branch app code is never merged into main — each ref is checked out fresh.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- main -> dist/ (root) ----
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          path: src-main

      - name: Build main (root base)
        working-directory: src-main
        run: |
          npm ci
          BASE_PATH=/ npm run build

      - name: Stage main at dist/
        run: |
          mkdir -p dist
          cp -R src-main/dist/. dist/

      # ---- dev -> dist/dev/ ----
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          lfs: true
          path: src-dev

      - name: Build dev (/dev/ base)
        working-directory: src-dev
        run: |
          npm ci
          BASE_PATH=/dev/ npm run build

      - name: Stage dev at dist/dev/
        run: |
          mkdir -p dist/dev
          cp -R src-dev/dist/. dist/dev/

      # ---- feat/cohorts -> dist/feat-cohorts/ ----         
      - name: Checkout feat/cohorts
        uses: actions/checkout@v4                                                                                                 
        with:
          ref: feat/cohorts                                                                                                       
          lfs: true                                          
          path: src-feat-cohorts

      - name: Build feat/cohorts (/feat-cohorts/ base)                                                                            
        working-directory: src-feat-cohorts
        run: |                                                                                                                    
          npm ci                                             
          BASE_PATH=/feat-cohorts/ npm run build
                                                                                                                                    
      - name: Stage feat/cohorts at dist/feat-cohorts/
        run: |                                                                                                                    
          mkdir -p dist/feat-cohorts                         
          cp -R src-feat-cohorts/dist/. dist/feat-cohorts/


      # ---- moma -> dist/moma/ ----
      - name: Checkout moma
        uses: actions/checkout@v4
        with:
          ref: moma
          lfs: true
          path: src-moma

      - name: Build moma (/moma/ base)
        working-directory: src-moma
        run: |
          npm ci
          BASE_PATH=/moma/ npm run build

      - name: Stage moma at dist/moma/
        run: |
          mkdir -p dist/moma
          cp -R src-moma/dist/. dist/moma/

      # ---- custom domain + upload ----
      # Required: the CNAME is held in Pages settings today, and a combined
      # artifact deploy would otherwise wipe the twosides.earth domain.
      - name: Write CNAME
        run: echo "twosides.earth" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
