name: Deploy site (combined)

# Builds every published branch into ONE GitHub Pages artifact:
#   main -> dist/      -> twosides.earth
#   dev  -> dist/dev/  -> twosides.earth/dev
#   moma -> dist/moma/ -> twosides.earth/moma   (the exhibition build)
#
# This file is the single source of truth and lives only on `main`.
# `repository_dispatch` and `workflow_dispatch` always run the workflow file
# from the default branch, so a push to `dev` fires the ping in
# .github/workflows/trigger-deploy.yml (on `dev`) and this file does the work.
# Branch app code is never merged into main — each ref is checked out fresh.
#
# LFS: the repo is cloned ONCE without LFS, and the branches are git worktrees
# of that clone, so they share a single .git/lfs store. That store is kept in
# the Actions cache, keyed on the set of LFS objects the published branches
# point at. A deploy therefore downloads only the objects that are new since
# the last run (usually none) instead of every branch's full set every time —
# LFS bandwidth is metered per download, and Actions downloads count.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- one clone, LFS pointers only ----
      - name: Checkout main (LFS deferred)
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          path: src-main

      - name: Fetch dev + moma refs
        working-directory: src-main
        run: |
          git fetch --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/moma:refs/remotes/origin/moma

      # ---- shared LFS store, cached across runs ----
      - name: Hash the LFS objects the published branches need
        id: lfs
        working-directory: src-main
        run: |
          for ref in origin/main origin/dev origin/moma; do
            git lfs ls-files -l "$ref" | cut -d' ' -f1
          done | sort -u > ../lfs-oids.txt
          echo "hash=$(sha256sum ../lfs-oids.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Exact hit: nothing to download. Otherwise restore the newest older
      # store and let `git lfs fetch` top up just the missing objects.
      - name: Restore LFS store
        uses: actions/cache@v4
        with:
          path: src-main/.git/lfs
          key: lfs-${{ steps.lfs.outputs.hash }}
          restore-keys: lfs-

      - name: Fetch missing LFS objects and add branch worktrees
        working-directory: src-main
        run: |
          git lfs install --local
          git lfs fetch origin origin/main origin/dev origin/moma
          git lfs checkout
          git worktree add --detach ../src-dev origin/dev
          git worktree add --detach ../src-moma origin/moma

      # ---- main -> dist/ (root) ----
      - name: Build main (root base)
        working-directory: src-main
        run: |
          npm ci
          BASE_PATH=/ npm run build

      - name: Stage main at dist/
        run: |
          mkdir -p dist
          cp -R src-main/dist/. dist/

      # ---- dev -> dist/dev/ ----
      - name: Build dev (/dev/ base)
        working-directory: src-dev
        run: |
          npm ci
          BASE_PATH=/dev/ npm run build

      - name: Stage dev at dist/dev/
        run: |
          mkdir -p dist/dev
          cp -R src-dev/dist/. dist/dev/

      # ---- moma -> dist/moma/ ----
      - name: Build moma (/moma/ base)
        working-directory: src-moma
        run: |
          npm ci
          BASE_PATH=/moma/ npm run build

      - name: Stage moma at dist/moma/
        run: |
          mkdir -p dist/moma
          cp -R src-moma/dist/. dist/moma/

      # ---- custom domain + upload ----
      # Required: the CNAME is held in Pages settings today, and a combined
      # artifact deploy would otherwise wipe the twosides.earth domain.
      - name: Write CNAME
        run: echo "twosides.earth" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
