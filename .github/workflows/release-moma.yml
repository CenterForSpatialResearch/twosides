name: Release exhibition build

on:
  push:
    tags:
      # Project-scoped releases: <project>-v<semver>, e.g. moma-v1.0.0.
      # The [0-9] guard keeps a non-release tag like `moma-vfinal` from
      # building. 
      - '*-v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (base path /)
        run: npm run build

      # Wrap the build in a folder named after the tag so a terminal `unzip`
      # lands in one directory (GUI extractors invent one anyway), and drop the
      # run instructions and launchers from release/ inside it.
      - name: Stage release folder and zip
        run: |
          STAGE=twosides-${{ github.ref_name }}
          mv dist "$STAGE"
          cp release/README.txt release/start-macos.command release/start-windows.bat "$STAGE"/
          chmod +x "$STAGE"/start-macos.command
          zip -r "$STAGE.zip" "$STAGE"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: twosides-${{ github.ref_name }}.zip
          generate_release_notes: true
