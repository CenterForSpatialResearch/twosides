name: Trigger site rebuild

# The real build lives in deploy.yml on `main`. repository_dispatch always runs
# the workflow file from the default branch, so this only needs to fire the event.
on:
  push:
    branches: [dev]

permissions:
  contents: write # required to POST a repository_dispatch

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch on main
        run: |
          curl -fsS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-preview"}'
