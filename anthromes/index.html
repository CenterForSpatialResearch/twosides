<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radial Anthromes Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @font-face { font-family: "Pelikan"; src: url("ABCPelikan-Regular-Trial.woff") format("woff"); }
    :root{
      --bg:#0e0b16; --fg:#ffffff; --muted:#cfd3e0; --panel:#141226; --accent:#7ad7ff;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html,body{height:100%;}
    body{ margin:0; font-family:"Pelikan",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--fg); }

    /* Left-side title — same id and styling pattern as the BIOMES/tree page */
    #sideTitle{
      position: fixed; right:14px; top:50%; transform:translateY(-50%);
      writing-mode: vertical-rl; text-orientation: mixed;
      letter-spacing:.08em; font-weight:600; font-size:14px; color:var(--muted);
      opacity:.9; user-select:none; z-index:4;
    }

    /* Controls hidden behind gear */
    #controls{ position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:center; padding:10px 12px; background:linear-gradient(180deg, rgba(14,11,22,.95), rgba(14,11,22,.75)); backdrop-filter: blur(6px); border-bottom:1px solid rgba(255,255,255,.08);}
    #controls label{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted);}
    #controls select, #controls button{ background:var(--panel); color:var(--fg); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:6px 10px; }
    #controls button{ cursor:pointer; box-shadow: var(--shadow); }
    #controls.hidden{ display:none; }

    /* Small filter group layout */
    .filter-group{ display:flex; align-items:center; gap:16px; padding:8px 12px; border:1px solid rgba(255,255,255,.08); border-radius:10px; background:rgba(255,255,255,.03); }
    .filter-sub{ display:flex; flex-direction:column; gap:6px; }
    .filter-sub label{ font-size:12px; color:var(--muted); }
    .slider-container{ display:flex; flex-direction:column; gap:4px; min-width:200px; }
    .slider-values{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
    input[type="range"]{ width:100%; }

    #menuToggle{
      position: fixed; top: 10px; right: 10px; z-index: 6;
      background: var(--panel); border:1px solid rgba(255,255,255,.14);
      width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow: var(--shadow); font-size:16px; color:var(--muted);
    }
    #menuToggle:hover{ color:var(--fg); }

    svg{ display:block; margin:auto; background:var(--bg); }

    /* Segments: slim visuals, wide transparent hits */
    .layer path.segment{ vector-effect: non-scaling-stroke; stroke-linecap:round; stroke:none; opacity:.92; }
    .segment.is-hover{ opacity:1; filter:drop-shadow(0 0 6px rgba(0,0,0,.35)); }
    .segment.is-selected{ opacity:1; filter:drop-shadow(0 0 10px rgba(0,0,0,.5)); }
    .hit{ fill:rgba(0,0,0,0); pointer-events:all; }

    /* Grid + labels */
    .axis-circles circle{ stroke:#ffffff; stroke-opacity:.45; fill:none; stroke-dasharray:2,2; }
    .year-axis line{ stroke:#ffffff; stroke-opacity:.6; }
    .year-axis text{ fill:#ffffff; font-size:11px; opacity:.9; }
    .value-label{ fill:#ffffff; opacity:.5; font-size:12px; }

    /* Legend panel */
    .legend-text{ fill:var(--fg); font-size:16px; }
    .legend-panel{ fill:rgba(20,18,38,.9); stroke:rgba(255,255,255,.12); stroke-width:1; filter:drop-shadow(0 6px 16px rgba(0,0,0,.35)); }

    /* Tooltip */
    #tooltip{
      position:fixed; left:0; top:0; pointer-events:none; z-index:10;
      background:#111827; color:#f9fafb; border:1px solid rgba(255,255,255,.12);
      border-radius:12px; box-shadow: var(--shadow); max-width:380px; min-width:240px; padding:12px 14px; line-height:1.45;
    }
    #tooltip.hidden{ display:none; }
    #tooltip .title{ font-size:16px; font-weight:700; margin-bottom:4px; }
    #tooltip .subtitle{ font-size:12px; color:#cbd5e1; margin-bottom:8px; }
    #tooltip .summary b{ font-weight:700; }
    #tooltip .kv{ display:grid; grid-template-columns: 1fr auto; gap:6px 10px; margin-top:10px; font-size:12px; border-top:1px dashed rgba(255,255,255,.14); padding-top:8px; }
    #tooltip .kv .k{ color:#94a3b8; }

    .map-mask-stroke{ fill:none; stroke:#ffffff; stroke-opacity:.25; stroke-width:1.5; }
  </style>
</head>
<body>
  <!-- Same side title id as the tree page -->
  <div id="sideTitle">ANTHROMES // 12,017 YEARS OF LAND USE</div>

  <button id="menuToggle" aria-label="Toggle settings" title="Toggle settings">⚙️</button>

  <div id="controls" class="hidden">
    <label>View Size:
      <select id="viewMode">
        <option value="preview">Preview (1200×1200)</option>
        <option value="full" selected>Full Export (7000×7000)</option>
      </select>
    </label>

    <!-- Filters -->
    <div class="filter-group" id="filters">
      <div class="filter-sub">
        <label>Anthrome Type Range (Min - Max)</label>
        <div class="slider-container">
          <div class="slider-values"><span id="anthromeMinLabel">Loading...</span><span id="anthromeMaxLabel">Loading...</span></div>
          <input type="range" id="anthromeMinSlider" />
          <input type="range" id="anthromeMaxSlider" />
        </div>
      </div>
      <div class="filter-sub">
        <label>Year Range (Min - Max)</label>
        <div class="slider-container">
          <div class="slider-values"><span id="yearMinLabel">Loading...</span><span id="yearMaxLabel">Loading...</span></div>
          <input type="range" id="yearMinSlider" />
          <input type="range" id="yearMaxSlider" />
        </div>
      </div>
      <div class="filter-sub">
        <button id="applyFiltersBtn">Apply</button>
        <button id="clearFiltersBtn">Clear</button>
      </div>
    </div>

    <button id="export">Export SVG</button>
    <span style="font-size:12px;color:var(--muted);">Tip: hover for details, click to pin; click empty space to unpin. Press "m" to toggle menu, "Esc" to clear filters. Scroll to zoom, drag to pan.</span>
  </div>

  <div id="tooltip" class="hidden" role="dialog" aria-live="polite"></div>
  <svg id="chart"></svg>

<script>
const svg = d3.select("#chart");
const g = svg.append("g");
const defs = svg.append("defs");

// Setup zoom behavior
const zoom = d3.zoom()
  .scaleExtent([1, 10])  // Allow zoom from 1x to 10x
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  });

svg.call(zoom);

/* Match tree canvas: same overall diameter */
const fullSize = 7000, previewSize = 1200;
let currentSize = "full";

const tooltip = d3.select('#tooltip');
let pinned = null;
let selectedKey = null;

// How far to fade non-matching elements when filters are active
const DIM_OPACITY = 0.02;       // super faint
const DIM_LABEL_OPACITY = 0.10; // labels slightly higher to stay barely legible

// Keep handles for re-use during filtering
let handles = { segments: null, hits: null, yearAxisElements: null, valueLabels: null };

const colorMapping = {
  "Urban": "#5f0f40",
  "Mixed settlements": "#792775",
  "Rice villages": "#933faa",
  "Irrigated villages": "#ac55d5",
  "Rainfed villages": "#bf55a4",
  "Pastoral villages": "#d25572",
  "Residential irrigated croplands": "#e55641",
  "Residential rainfed croplands": "#f8560f",
  "Populated croplands": "#de691f",
  "Remote croplands": "#bb7f3c",
  "Residential rangelands": "#999559",
  "Populated rangelands": "#76ac76",
  "Remote rangelands": "#53c293",
  "Residential woodlands": "#30d8b1",
  "Populated woodlands": "#1aebc3",
  "Remote woodlands": "#44e9a0",
  "Inhabited drylands": "#6de67d",
  "Wild woodlands": "#97e45a",
  "Wild drylands": "#c1e236",
  "Ice (uninhabited)": "#ebe013",
  "No land": "#2E8B57"
};

// Anthrome codes will be read from CSV - code to label mapping
let anthromeCodeToLabel = {};
let labelToAnthromeCode = {};
let allYears = [];
let allAnthromeCodes = [];

/* Tooltip helpers */
const fmt = d3.format(",");
const pct = (v,t)=> t? d3.format(".1%")(v/t) : "—";
const summaryHTML = (label,year,count,total)=>`<div class="summary">In <b>${year}</b>, <b>${label}</b> accounts for <b>${fmt(count)}</b> units (<b>${pct(count,total)}</b> of the year’s total).</div>`;
const tipHTML = (label,year,count,total)=>`
  <div class="title">${label}</div>
  <div class="subtitle">Year ${year}</div>
  ${summaryHTML(label,year,count,total)}
  <div class="kv">
    <div class="k">Year total</div><div>${fmt(total)}</div>
    <div class="k">Segment value</div><div>${fmt(count)}</div>
    <div class="k">Share</div><div>${pct(count,total)}</div>
  </div>`;

function posTip(evt){
  const pad=14, node=tooltip.node(), r=node.getBoundingClientRect(), tw=r.width, th=r.height;
  let x=evt.clientX+pad, y=evt.clientY-pad-th; if(y<8)y=evt.clientY+pad;
  x=Math.min(Math.max(8,x), window.innerWidth-tw-8); y=Math.min(Math.max(8,y), window.innerHeight-th-8);
  tooltip.style("left",x+"px").style("top",y+"px");
}
function showTip(html,evt){ tooltip.html(html).classed("hidden",false); posTip(evt); }
function hideTip(){ if(!pinned) tooltip.classed("hidden",true); }

function attachHandlers(sel, keyAcc, htmlAcc){
  sel.on("mousemove", function(evt,d){ if(pinned) return; if(tooltip.classed("hidden")) showTip(htmlAcc(d),evt); else posTip(evt); })
     .on("mouseover", function(evt,d){ const key=keyAcc(d); d3.selectAll(`[data-key="${key}"]`).classed("is-hover",true); if(!pinned) showTip(htmlAcc(d),evt); })
     .on("mouseout", function(){ const key=keyAcc(d3.select(this).datum()); d3.selectAll(`[data-key="${key}"]`).classed("is-hover",false); hideTip(); })
     .on("click", function(evt,d){
        const key=keyAcc(d);
        if(pinned && key===selectedKey){ pinned=null; selectedKey=null; d3.selectAll(".segment").classed("is-selected",false); hideTip(); evt.stopPropagation(); return; }
        pinned=d; selectedKey=key; d3.selectAll(".segment").classed("is-selected",false); d3.selectAll(`[data-key="${key}"]`).classed("is-selected",true); showTip(htmlAcc(d),evt); evt.stopPropagation();
     });
}
window.addEventListener("click",(e)=>{ if(e.target.closest("#tooltip")) return; pinned=null; selectedKey=null; d3.selectAll(".segment").classed("is-selected",false); hideTip(); });

// ======== Filters state & logic ========
const filterState = {
  anthromeMin: 0,
  anthromeMax: 999,
  yearMin: -999999,
  yearMax: 999999
};

function readFilterUI(){
  let minVal = +document.getElementById('anthromeMinSlider').value;
  let maxVal = +document.getElementById('anthromeMaxSlider').value;

  // Ensure min <= max
  if (minVal > maxVal) {
    document.getElementById('anthromeMaxSlider').value = minVal;
    maxVal = minVal;
  }

  filterState.anthromeMin = minVal;
  filterState.anthromeMax = maxVal;

  let yearMinVal = +document.getElementById('yearMinSlider').value;
  let yearMaxVal = +document.getElementById('yearMaxSlider').value;

  // Ensure min <= max
  if (yearMinVal > yearMaxVal) {
    document.getElementById('yearMaxSlider').value = yearMinVal;
    yearMaxVal = yearMinVal;
  }

  filterState.yearMin = yearMinVal;
  filterState.yearMax = yearMaxVal;

  // Update labels
  document.getElementById('anthromeMinLabel').textContent = `${filterState.anthromeMin} - ${anthromeCodeToLabel[filterState.anthromeMin] || 'Unknown'}`;
  document.getElementById('anthromeMaxLabel').textContent = `${filterState.anthromeMax} - ${anthromeCodeToLabel[filterState.anthromeMax] || 'Unknown'}`;
  document.getElementById('yearMinLabel').textContent = filterState.yearMin;
  document.getElementById('yearMaxLabel').textContent = filterState.yearMax;
}

let filteredSampleCount = 0;
function segmentMatchesFilters(d){
  const anthromeCode = labelToAnthromeCode[d.label];
  if (!anthromeCode) {
    console.log('No anthrome code for label:', d.label);
    return false;
  }
  const anthromeMatch = anthromeCode >= filterState.anthromeMin && anthromeCode <= filterState.anthromeMax;
  const yearMatch = d.year >= filterState.yearMin && d.year <= filterState.yearMax;
  const matches = anthromeMatch && yearMatch;

  // Only log first 5 filtered items as sample
  if (!matches && filteredSampleCount < 5) {
    console.log('Sample filtered out:', { label: d.label, year: d.year, anthromeCode, filterState, anthromeMatch, yearMatch });
    filteredSampleCount++;
  }

  return matches;
}

function applyFilters(){
  readFilterUI();
  filteredSampleCount = 0; // Reset sample counter

  // Check if filters are at default (show all) - use actual data ranges
  const isDefault = allAnthromeCodes.length > 0 && allYears.length > 0 &&
                    filterState.anthromeMin === allAnthromeCodes[0] &&
                    filterState.anthromeMax === allAnthromeCodes[allAnthromeCodes.length - 1] &&
                    filterState.yearMin === allYears[0] &&
                    filterState.yearMax === allYears[allYears.length - 1];

  console.log('Apply Filters:', {
    filterState,
    isDefault,
    allAnthromeCodes,
    allYears
  });

  if (isDefault){
    // Clear all filters - show everything
    g.classed('isolated', false);
    g.selectAll('.segment').style('opacity', null).style('pointer-events', null);
    g.selectAll('.hit').style('opacity', null).style('pointer-events', null);
    if (handles.yearAxisElements) {
      handles.yearAxisElements.style('opacity', null).style('pointer-events', null);
    }
    return;
  }

  g.classed('isolated', true);

  // Filter segments - use style instead of attr for opacity
  const allSegments = g.selectAll('.segment');
  console.log('Total segments found:', allSegments.size());

  let matchCount = 0;
  let noMatchCount = 0;

  allSegments.each(function() {
    const d = d3.select(this).datum();
    if (!d) return;

    const matches = segmentMatchesFilters(d);
    if (matches) {
      matchCount++;
      d3.select(this).style('opacity', 1).style('pointer-events', 'all');
    } else {
      noMatchCount++;
      d3.select(this).style('opacity', DIM_OPACITY).style('pointer-events', 'none');
    }
  });

  console.log(`Segments: ${matchCount} visible, ${noMatchCount} dimmed`);

  g.selectAll('.hit').each(function() {
    const d = d3.select(this).datum();
    if (!d) return;

    const matches = segmentMatchesFilters(d);
    d3.select(this)
      .style('opacity', matches ? 1 : 0)
      .style('pointer-events', matches ? 'all' : 'none');
  });

  // Dim year axis elements if year filter is active
  const yearFilterActive = allYears.length > 0 &&
                           (filterState.yearMin !== allYears[0] || filterState.yearMax !== allYears[allYears.length - 1]);
  if (handles.yearAxisElements && yearFilterActive) {
    handles.yearAxisElements.each(function() {
      const year = +d3.select(this).attr('data-year');
      const inRange = year >= filterState.yearMin && year <= filterState.yearMax;
      d3.select(this).style('opacity', inRange ? 1 : DIM_LABEL_OPACITY);
    });
  } else if (handles.yearAxisElements) {
    handles.yearAxisElements.style('opacity', null);
  }
}

/* Render */
function render(size="full"){
  const dim = size==="full" ? fullSize : previewSize;
  svg.attr("viewBox", `${-dim/2} ${-dim/2} ${dim} ${dim}`);
  g.selectAll("*").remove(); defs.selectAll("*").remove();

  /* Make the radial chart a bit smaller within the same 7000 canvas */
  const outerMargin = 260;                         // increase margin to shrink overall plot
  const radius = dim/2 - outerMargin;              // smaller than before
  const innerRadius = (size==="full") ? 2200 : Math.max(180, radius * 0.44); // also slightly smaller map

  /* Center map overlay clipped to innerRadius */
  const clipId = "map-clip";
  defs.append("clipPath").attr("id",clipId).append("circle").attr("r",innerRadius).attr("cx",0).attr("cy",0);
  // g.append("image")
  //   .attr("href","2017AD_twoPoint_sphere-plain.png")
  //   .attr("x",-innerRadius).attr("y",-innerRadius)
  //   .attr("width",(innerRadius)*2).attr("height",(innerRadius)*2)
  //   .attr("preserveAspectRatio","xMidYMid slice")
  //   .attr("clip-path",`url(#${clipId})`);

  // New map without preserving aspect ratio - stretched vertically
  g.append("image")
    .attr("href","2017AD_twoPoint_sphere-plain.png")
    .attr("x",-innerRadius*1.75).attr("y",-innerRadius*1.1)
    .attr("width",(innerRadius)*3.7).attr("height",(innerRadius)*2.2)
    .attr("preserveAspectRatio","none")
    .attr("clip-path",`url(#${clipId})`);
  g.append("circle").attr("class","map-mask-stroke").attr("r",innerRadius).attr("cx",0).attr("cy",0);

  d3.csv("anthromes_counts.csv", d3.autoType).then(data=>{
    data.forEach(d=>{ d.year=+d.year; d.count=+d.count; d.anthrome=+d.anthrome; });

    // Extract unique years and anthrome codes from data
    allYears = Array.from(new Set(data.map(d=>d.year))).sort((a,b)=>a-b);
    allAnthromeCodes = Array.from(new Set(data.map(d=>d.anthrome))).sort((a,b)=>a-b);

    // Build mappings from data
    data.forEach(d => {
      if (!anthromeCodeToLabel[d.anthrome]) {
        anthromeCodeToLabel[d.anthrome] = d.label;
        labelToAnthromeCode[d.label] = d.anthrome;
      }
    });

    // Initialize sliders with actual data ranges
    const yearMin = allYears[0];
    const yearMax = allYears[allYears.length - 1];
    const anthromeMin = allAnthromeCodes[0];
    const anthromeMax = allAnthromeCodes[allAnthromeCodes.length - 1];

    document.getElementById('yearMinSlider').min = yearMin;
    document.getElementById('yearMinSlider').max = yearMax;
    document.getElementById('yearMinSlider').value = yearMin;
    document.getElementById('yearMaxSlider').min = yearMin;
    document.getElementById('yearMaxSlider').max = yearMax;
    document.getElementById('yearMaxSlider').value = yearMax;

    document.getElementById('anthromeMinSlider').min = anthromeMin;
    document.getElementById('anthromeMinSlider').max = anthromeMax;
    document.getElementById('anthromeMinSlider').value = anthromeMin;
    document.getElementById('anthromeMaxSlider').min = anthromeMin;
    document.getElementById('anthromeMaxSlider').max = anthromeMax;
    document.getElementById('anthromeMaxSlider').value = anthromeMax;

    // Update filter state defaults
    filterState.yearMin = yearMin;
    filterState.yearMax = yearMax;
    filterState.anthromeMin = anthromeMin;
    filterState.anthromeMax = anthromeMax;

    readFilterUI(); // Initialize labels

    const years = allYears;
    const labels = Object.keys(colorMapping);

    const totalsByYear = d3.rollup(data, v=> d3.sum(v, d=>d.count), d=>d.year);

    const dataByYear = d3.rollups(
      data,
      v => { const o={}; v.forEach(d=> o[d.label]=d.count); return o; },
      d=> d.year
    ).sort((a,b)=> a[0]-b[0]);

    const stacked = d3.stack()
      .keys(labels)
      .value((yearEntry, key) => yearEntry[1][key] || 0)
      (dataByYear);

    const angle = d3.scaleBand().domain(years).range([0, 2*Math.PI]).align(0);

    const maxCount = d3.max(stacked[stacked.length-1], d=> d[1]);
    const rScale = d3.scaleLinear().domain([0, maxCount]).range([innerRadius, radius]);

    // Arcs computed from explicit year
    const arc = d3.arc()
      .innerRadius(d=> rScale(d.seg[0]))
      .outerRadius(d=> rScale(d.seg[1]))
      .startAngle(d=> angle(d.year))
      .endAngle(d=> angle(d.year) + angle.bandwidth())
      .padAngle(0.003)
      .padRadius(innerRadius);

    const arcHit = d3.arc()
      .innerRadius(d=> Math.max(0, rScale(d.seg[0]) - 8))
      .outerRadius(d=> rScale(d.seg[1]) + 8)
      .startAngle(d=> angle(d.year))
      .endAngle(d=> angle(d.year) + angle.bandwidth())
      .padAngle(0.006)
      .padRadius(innerRadius);

    const layers = g.selectAll("g.layer")
      .data(stacked, d=>d.key)
      .join("g")
      .attr("class","layer")
      .attr("fill", d=> colorMapping[d.key] || "#ccc");

    const segData = series => series.map((seg,i)=> ({ seg, year: dataByYear[i][0], label: series.key }));

    const segments = layers.selectAll("path.segment")
      .data(d => segData(d), d=> `${d.year}__${d.label}`)
      .join("path")
      .attr("class","segment")
      .attr("data-key", d=> `${d.year}__${d.label}`)
      .attr("d", d=> arc(d));

    const hits = layers.selectAll("path.hit")
      .data(d => segData(d), d=> `${d.year}__${d.label}`)
      .join("path")
      .attr("class","hit")
      .attr("data-key", d=> `${d.year}__${d.label}`)
      .attr("d", d=> arcHit(d));

    const keyAcc = d=> `${d.year}__${d.label}`;
    const htmlAcc = d=> {
      const total = totalsByYear.get(d.year) || 0;
      const val = Math.max(0, d.seg[1]-d.seg[0]);
      return tipHTML(d.label, d.year, val, total);
    };
    attachHandlers(hits, keyAcc, htmlAcc);

    // Radial grid
    const tickCount = 6;
    const ticks = rScale.ticks(tickCount);
    const axisCircleGroup = g.append("g").attr("class","axis-circles");
    axisCircleGroup.selectAll("circle").data(ticks).join("circle").attr("r", rScale);

    // Value labels (8 rays)
    const rays = d3.range(0, 2*Math.PI, 2*Math.PI/8);
    const valueLabels = g.append("g").attr("class","value-labels");
    ticks.forEach(t=>{
      const R = rScale(t);
      rays.forEach(a=>{
        valueLabels.append("text")
          .attr("class","value-label")
          .attr("x", Math.cos(a)*R)
          .attr("y", Math.sin(a)*R)
          .attr("text-anchor","middle")
          .attr("alignment-baseline","middle")
          .text(t);
      });
    });

    // Year ticks/labels
    const yearAxis = g.append("g").attr("class","year-axis");
    years.forEach(year=>{
      const a = angle(year) + angle.bandwidth()/2 - Math.PI/2;
      const x1 = Math.cos(a)*(innerRadius-6), y1 = Math.sin(a)*(innerRadius-6);
      const x2 = Math.cos(a)*innerRadius,     y2 = Math.sin(a)*innerRadius;
      yearAxis.append("line")
        .attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
        .attr("data-year", year);
      const lx = Math.cos(a)*(innerRadius-20), ly = Math.sin(a)*(innerRadius-20);
      yearAxis.append("text")
        .attr("x",lx).attr("y",ly)
        .attr("text-anchor","middle")
        .attr("alignment-baseline","middle")
        .attr("data-year", year)
        .text(year);
    });

    // Legend: two columns
    const entries = Object.entries(colorMapping);
    const colCount = Math.ceil(entries.length/2);
    const colW = 420, rowH = 26, pad = 18, sw = 18;
    const panelW = colW*2 + pad*2, panelH = rowH*colCount + pad*2;
    const legendX = (-dim/2) + 40, legendY = (-dim/2) + 40;

    const legend = g.append("g").attr("transform",`translate(${legendX},${legendY})`);
    legend.append("rect").attr("class","legend-panel").attr("x",0).attr("y",0).attr("rx",14).attr("ry",14).attr("width",panelW).attr("height",panelH);
    entries.forEach(([label,color], i)=>{
      const col = (i<colCount)?0:1, row=(i<colCount)?i:i-colCount;
      const gx = pad + col*colW, gy = pad + row*rowH;
      const item = legend.append("g").attr("transform",`translate(${gx},${gy})`);
      item.append("rect").attr("x",0).attr("y",4).attr("width",sw).attr("height",sw).attr("rx",4).attr("ry",4).attr("fill",color);
      item.append("text").attr("x",sw+10).attr("y",18).attr("class","legend-text").text(label);
    });

    // Store handles for filtering
    handles.segments = segments;
    handles.hits = hits;
    handles.yearAxisElements = yearAxis.selectAll('[data-year]');
    handles.valueLabels = valueLabels.selectAll('.value-label');

    // Apply current filter state
    applyFilters();
  });
}

render();

/* UI */
document.getElementById('menuToggle').addEventListener('click', ()=> document.getElementById('controls').classList.toggle('hidden'));
window.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase()==='m'){
    document.getElementById('controls').classList.toggle('hidden');
  }
  if(e.key === 'Escape'){
    // Reset filters to data defaults
    if (allAnthromeCodes.length > 0 && allYears.length > 0) {
      document.getElementById('anthromeMinSlider').value = allAnthromeCodes[0];
      document.getElementById('anthromeMaxSlider').value = allAnthromeCodes[allAnthromeCodes.length - 1];
      document.getElementById('yearMinSlider').value = allYears[0];
      document.getElementById('yearMaxSlider').value = allYears[allYears.length - 1];
      applyFilters();
    }
  }
});

// Helper function to snap slider to nearest valid value
function snapToNearestValue(value, validValues) {
  let nearest = validValues[0];
  let minDiff = Math.abs(value - nearest);
  for (let v of validValues) {
    const diff = Math.abs(value - v);
    if (diff < minDiff) {
      minDiff = diff;
      nearest = v;
    }
  }
  return nearest;
}

// Slider event listeners for real-time label updates and snapping
document.getElementById('anthromeMinSlider').addEventListener('input', function(e) {
  if (allAnthromeCodes.length > 0) {
    const snapped = snapToNearestValue(+e.target.value, allAnthromeCodes);
    e.target.value = snapped;
  }
  readFilterUI();
});

document.getElementById('anthromeMaxSlider').addEventListener('input', function(e) {

d3.select("#viewMode").on("change", function(){ currentSize = this.value; render(currentSize); });
d3.select("#export").on("click", function(){
  const serializer = new XMLSerializer();
  const source = serializer.serializeToString(svg.node());
  const blob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href=url; link.download=`radial_chart_${currentSize}.svg`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
});

document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
document.getElementById('clearFiltersBtn').addEventListener('click', ()=>{

    document.getElementById('anthromeMinSlider').value = allAnthromeCodes[0];
    document.getElementById('anthromeMaxSlider').value = allAnthromeCodes[allAnthromeCodes.length - 1];
    document.getElementById('yearMinSlider').value = allYears[0];

});
