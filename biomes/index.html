<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BIOMES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @font-face { font-family: "Pelikan"; src: url("ABCPelikan-Regular-Trial.woff") format("woff"); font-display: swap; }
    :root{
      --bg:#0e0b16; --fg:#ffffff; --muted:#cfd3e0; --panel:#141226; --accent:#7ad7ff;
      --chipBorder:rgba(255,255,255,.25);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --R: 80px;          /* collapsed radius */
      --circlePad: 22px;  /* inner padding */
    }
    html,body{height:100%;}
    body{ margin:0; font-family:"Pelikan",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--fg); }

    /* Side title */
    #sideTitle{
      position: fixed; left:14px; top:50%; transform:translateY(-50%);
      writing-mode: vertical-rl; text-orientation: mixed;
      letter-spacing:.08em; font-weight:600; font-size:20px; color:var(--muted);
      opacity:.9; user-select:none; z-index: 4;
    }

    /* Settings */
    #menuToggle{
      position: fixed; top: 12px; right: 12px; z-index: 8;
      background: var(--panel); border:1px solid rgba(255,255,255,.14);
      width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow: var(--shadow); font-size:18px; color:var(--muted);
    }
    #menuToggle:hover{ color:var(--fg); }
    #settings{
      position: fixed; top: 64px; right: 12px; z-index: 7;
      background: linear-gradient(180deg, rgba(20,18,38,.97), rgba(20,18,38,.9));
      border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 14px; width: 320px;
      box-shadow: var(--shadow); backdrop-filter: blur(6px); display:none;
    }
    #settings.open{ display:block; }
    #settings label{ display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:13px; margin:8px 0; }
    #settings select, #settings input[type="range"], #settings button{ background:var(--panel); color:var(--fg); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:6px 10px; }
    #settings input[type="range"]{ accent-color: var(--accent); width: 160px; }
    #settings .tip{ font-size:12px; color:var(--muted); margin-top:8px; line-height:1.45; }

    /* Viz */
    svg#chart{ display:block; margin:auto; background:var(--bg); }
    .region-path{ fill-opacity:1; stroke:none; }
    .region-label{ font-size:24px; fill:var(--fg); font-weight:300; }
    .internal-label{ font-size:6px; fill:var(--fg); }
    .node circle{ stroke:white; stroke-width:.4; r:2.5; }
    .link{ fill:none; stroke:var(--fg); stroke-width:.5; stroke-opacity:.35; vector-effect: non-scaling-stroke; stroke-linecap:round; }
    .sgb-line{ stroke:var(--fg); stroke-width:.5; fill:none; opacity:.8; vector-effect: non-scaling-stroke; stroke-linecap:round; }
    .hit{ fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; }
    .hit.sgb-hit{ stroke-width:16; }
    .bar-axis line{ stroke:var(--fg); stroke-width:1; }
    .bar-axis text{ fill:var(--fg); font-size:10px; }
    .hover-target{ cursor:crosshair; }
    .is-hover.link, .is-selected.link{ stroke-opacity:1; }
    .is-hover.link{ stroke-width:1.2; }
    .is-selected.link{ stroke-width:2; }
    .is-hover.sgb-line{ stroke-width:1.2; opacity:1; }
    .is-selected.sgb-line{ stroke-width:2; opacity:1; }
    .is-hover .node circle, .node.is-hover circle{ r:4; }
    .node.is-selected circle{ r:5; stroke-width:1; }
    .bar.is-hover, .usgb.is-hover, .western.is-hover{ filter:drop-shadow(0 0 6px rgba(255,255,255,.7)); }
    .bar.is-selected, .usgb.is-selected, .western.is-selected{ filter:drop-shadow(0 0 10px rgba(255,255,255,.9)); }

    /* Tooltip — refined */
    #tooltip{
      position:fixed; left:0; top:0; pointer-events:none; z-index:10;
      background:var(--panel); color:var(--fg); border:1px solid rgba(255,255,255,.14);
      border-radius:12px; box-shadow: var(--shadow); max-width:380px; min-width:260px;
      padding:12px 14px; line-height:1.45; font-family:"Pelikan",system-ui,sans-serif;
    }
    #tooltip.hidden{ display:none; }
    #tooltip .tip-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; }
    #tooltip .h-left{ display:flex; gap:10px; align-items:flex-start; }
    #tooltip .swatch{ width:12px; height:12px; border-radius:50%; border:1px solid rgba(255,255,255,.45); margin-top:4px; }
    #tooltip .title{ font-size:16px; font-weight:700; letter-spacing:.02em; }
    #tooltip .subtitle{ font-size:12px; color:var(--muted); margin-top:2px; }

    /* Mini glyph (lineage facsimile) */
    #tooltip .mini-glyph{ width:110px; height:110px; flex:0 0 auto; }
    #tooltip .mini-glyph path{ vector-effect: non-scaling-stroke; fill:none; stroke-width:1.2; }

    #tooltip .summary{ font-size:13px; margin:8px 0 6px; }
    #tooltip .summary b{ font-weight:700; }

    /* Key/values (simplified) */
    #tooltip .kv{ display:grid; grid-template-columns: 1fr auto; gap:6px 12px; margin-top:6px; font-size:12px; border-top:1px dashed rgba(255,255,255,.12); padding-top:8px; }
    #tooltip .kv .k{ color:var(--muted); }

    /* Actions */
    #tooltip .actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
    #tooltip button{ pointer-events:auto; background:#1d1a33; border:1px solid rgba(255,255,255,.12); color:var(--fg); border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer; }

    /* Tooltip tick meter (one line; simple fill) */
    #tooltip .genome-meter{ display:flex; align-items:center; gap:8px; margin-top:6px; }
    #tooltip .genome-meter .ticks{ display:flex; gap:2px; align-items:flex-end; flex-wrap:nowrap; }
    #tooltip .genome-meter .tick{
      width:6px; height:12px;
      background: transparent;
      border:1px solid rgba(255,255,255,.25);
      border-radius:2px;
    }
    #tooltip .genome-meter .tick.filled{
      background: var(--tickColor,#fff);
      border-color: transparent;
    }
    #tooltip .genome-meter .num{ font-size:12px; color:var(--muted); white-space:nowrap; }

    /* =============== Circular Filter =============== */
    #filterCircle{
      position: fixed;
      right: 24px; bottom: 24px;
      width: calc(var(--R)*2); height: calc(var(--R)*2);
      z-index: 999;
      transition: width .28s ease, height .28s ease, transform .28s ease, box-shadow .2s ease;
      transform-origin: bottom right;
      pointer-events: auto;
    }
    /* Stroke/caption always on top */
    #ringSvg{ position:absolute; inset:0; overflow:visible; pointer-events:none; z-index: 2; }
    .filter-ring{ fill:none; stroke:#fff; stroke-width:3px; }
    .filter-caption{ fill:#cfd3e0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; dominant-baseline: middle; }

    #filterCircle .content{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%;
      background: transparent; /* collapsed transparent */
      box-shadow: var(--shadow);
      padding: var(--circlePad);
      z-index: 1; /* under ringSvg */
    }
    #filterCircle.expanded .content{ background: var(--panel); } /* expanded = solid background */

    /* Collapsed: FILTER + chevron only */
    .fc-collapsed{ display:flex; align-items:center; gap:8px; }
    .fc-collapsed .label{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .fc-collapsed .chev{ border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color:var(--fg);
                          width:34px; height:28px; border-radius:10px; cursor:pointer; }

    /* Expanded UI */
    .fc-expanded{ display:none; width:100%; height:100%; }
    #filterCircle.expanded .fc-expanded{ display:flex; }
    #filterCircle.expanded .fc-collapsed{ display:none; }

    .sections{
      margin:auto;
      width: 86%; height: 86%;
      display:flex; flex-direction:column; gap:12px;
      align-items:center; justify-content:center; text-align:center;
    }
    .fc-head{ width:60%; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .fc-title{ font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
    .actions{ display:flex; gap:8px; }
    .btn{
      font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; cursor:pointer;
      padding:7px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:var(--fg);
    }
    .chevron{
      border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color:var(--fg);
      width:34px; height:28px; border-radius:10px; cursor:pointer;
    }
    .section{ width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
    .section h3{ margin:0; font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }

    .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .chip{
      white-space: nowrap; cursor: pointer; user-select: none;
      font-size: 12px; letter-spacing:.05em; text-transform: uppercase; font-weight:700;
      padding:8px 12px; border-radius:999px; border:1px solid var(--chipBorder);
      transition: transform .15s ease, filter .2s ease, outline .2s ease, opacity .2s ease;
    }
    .chip:hover{ transform: translateY(-1px); filter:brightness(1.06); }
    .chip.active{ outline:2px solid rgba(255,255,255,.75); }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06); color: var(--fg);
      font-size:12px; font-weight:700; text-transform:uppercase;
    }
    .pill input{ accent-color: var(--accent); }

    /* Compact mode at viewport cap */
    #filterCircle.compact .sections{ width: 84%; height: 84%; gap:10px; }
    #filterCircle.compact .section h3{ font-size:10px; letter-spacing:.12em; }
    #filterCircle.compact .chip{ font-size:11px; padding:7px 10px; }
    #filterCircle.compact .pill{ font-size:11px; padding:7px 10px; }
    #filterCircle.compact .btn{ font-size:10px; padding:6px 9px; }
  </style>
</head>
<body>
  <div id="sideTitle">BIOMES // 5000 LINES 5000 SPECIES</div>

  <!-- Settings -->
  <button id="menuToggle" aria-label="Open settings" title="Settings">⚙️</button>
  <div id="settings" role="dialog" aria-label="Settings">
    <label>View Size
      <select id="viewMode">
        <option value="preview">Preview (1200×1200)</option>
        <option value="full" selected>Full Export (6400×6400)</option>
      </select>
    </label>
    <label>Bundling Tension <span id="tensionLabel">0.95</span>
      <input type="range" id="tensionSlider" min="0.1" max="1.0" step="0.05" value="0.95" />
    </label>
    <button id="export">Export SVG</button>
    <div class="tip">Tip: hover for details, click to pin; click empty space to unpin. Press “m” to toggle this menu. Scroll to zoom, drag to pan.</div>
  </div>

  <!-- CIRCULAR FILTER -->
  <div id="filterCircle" aria-live="polite">
    <svg id="ringSvg" viewBox="-160 -160 320 320" aria-hidden="true">
      <defs>
        <!-- Inset caption path (updated dynamically) -->
        <path id="fc-arc-right" d="M 0 -60 A 60 60 0 0 1 0 60" />
      </defs>
      <circle id="fc-ring" class="filter-ring" cx="0" cy="0" r="60" />
      <text id="fc-caption" class="filter-caption" style="opacity:0;">
        <textPath href="#fc-arc-right" xlink:href="#fc-arc-right" startOffset="50%" text-anchor="middle">
          AN EXTENSIVE HUMAN MICROBIOME
        </textPath>
      </text>
    </svg>

    <div class="content">
      <!-- Collapsed -->
      <div class="fc-collapsed" aria-hidden="false">
        <span class="label">FILTER</span>
        <button id="expandCircle" class="chev" title="Expand">▾</button>
      </div>

      <!-- Expanded -->
      <div class="fc-expanded" aria-hidden="true">
        <div class="sections">
          <div class="fc-head">
            <div class="fc-title">Filters</div>
            <div class="actions">
              <button id="selectAllChips" class="btn" title="Select all phyla">Select All</button>
              <button id="clearChips" class="btn" title="Clear all filters">Clear</button>
              <button id="collapseCircle" class="chevron" title="Collapse">▴</button>
            </div>
          </div>

          <section class="section" aria-labelledby="sec-phylum">
            <h3 id="sec-phylum">Phylum</h3>
            <div id="phylumChips" class="chips" role="listbox" aria-multiselectable="true"></div>
          </section>

          <section class="section" aria-labelledby="sec-geo">
            <h3 id="sec-geo">Geography</h3>
            <div role="radiogroup" aria-label="Geography">
              <label class="pill"><input type="radio" name="western" value="any" checked/> Any</label>
              <label class="pill"><input type="radio" name="western" value="western"/> Western</label>
              <label class="pill"><input type="radio" name="western" value="nonwestern"/> Non-Western</label>
            </div>
          </section>

          <section class="section" aria-labelledby="sec-status">
            <h3 id="sec-status">Status</h3>
            <label class="pill" title="Unknown SGBs only">
              <input type="checkbox" id="unknownFilter" />
              Unknown
            </label>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Viz -->
  <svg id="chart" aria-label="Radial phylogenetic tree visualization" role="img"></svg>
  <div id="tooltip" class="hidden" role="dialog" aria-live="polite"></div>

<script>
/* ===== Base setup ===== */
const svg = d3.select("#chart");
const g = svg.append("g");
const defs = svg.append("defs");

const zoom = d3.zoom().scaleExtent([1, 10]).on("zoom", (event) => { g.attr("transform", event.transform); });
svg.call(zoom);

const fullSize = 7000, previewSize = 1200;
const fullRadius = 3000, previewRadius = 550;
let currentSize = "full";
let currentTension = 0.95;
const backgroundColor = "#0e0b16";
const tree = d3.cluster();
const tooltip = d3.select('#tooltip');
let pinnedDatum = null;
let selectedLeafId = null;
let highlightedLeaf = null; // NEW: for highlight state
let MAX_GENOME_COUNT = 1; // global max across leaves (set during render)
let TICK_DENOM = 1;

const DIM_OPACITY = 0.02, DIM_LABEL_OPACITY = 0.10;
let handles = { root: null, selections: {} };

/* ===== Colors ===== */
const colorMapping = {
  "Actinobacteria": "#1385eb","Bacteroidetes": "#b1f16e","Candidatus_Gracilibacteria": "#eb9c13",
  "Candidatus_Melainabacteria": "#ebe013","Candidatus_Saccharibacteria": "#6eeb13","Chlamydiae": "#eb139c",
  "Cyanobacteria": "#4717f6","Deinococcus_Thermus": "#13eb85","Elusimicrobia": "#eb1357","Euryarchaeota": "#eb13e0",
  "Firmicutes": "#AA55DA","Fusobacteria": "#c77dff","Planctomycetes": "#5f0f40","Proteobacteria": "#13ebc9",
  "Spirochaetes": "#fb5607","Synergistetes": "#ff006e","Tenericutes": "#8338ec","Unknown": "#13eb40",
  "Verrucomicrobia": "#3a86ff","Other": "#cccccc"
};
function pickTextColor(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.slice(0,2),16)/255, g = parseInt(c.slice(2,4),16)/255, b = parseInt(c.slice(4,6),16)/255;
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.5 ? '#0e0b16' : '#ffffff';
}

/* ===== Metadata helpers ===== */
const KEYMAP = {
  locations: ['Locations','Sample_Locations','Countries','SampleCountries','Sample Sites','sites','locations'],
  uSGB:      ['uSGB','novel','Novel','unknownSGB','Unknown_SGB'],
  western:   ['Westernized_Mode','Westernized_List','Westernized','westernized','Westernization']
};
function getMeta(meta, keys){ for (const k of keys){ if (meta && meta[k] != null) return meta[k]; } }
function parseMaybeList(v){
  if (v == null) return [];
  if (Array.isArray(v)) return v;
  const s = String(v).trim();
  if (!s) return [];
  if (s.startsWith('[') && s.endsWith(']')){ try { const arr = JSON.parse(s); return Array.isArray(arr) ? arr : [String(arr)]; } catch(_) {} }
  if (s.includes(',')) return s.split(',').map(x=>x.trim());
  return [s];
}
function parseWestern(meta){
  if (!meta) return null;
  const mode = (meta.Westernized_Mode ?? meta.westernized_mode ?? '').toString().toLowerCase();
  if (['yes','true','western'].includes(mode)) return 'western';
  if (['no','false','non-western','nonwestern'].includes(mode)) return 'nonwestern';
  const raw = getMeta(meta, ['Westernized_List','Westernized','westernized','Westernization']);
  const values = parseMaybeList(raw).map(x=>x.toString().toLowerCase());
  if (values.some(v => ['yes','true','western'].includes(v))) return 'western';
  if (values.some(v => ['no','false','non-western','nonwestern'].includes(v))) return 'nonwestern';
  const scalar = (raw ?? '').toString().toLowerCase();
  if (['yes','true','western'].includes(scalar)) return 'western';
  if (['no','false','non-western','nonwestern'].includes(scalar)) return 'nonwestern';
  return null;
}
function locationsFromMeta(meta){
  if (!meta) return '—';

  // Primary known key in your dataset
  let v = meta["Country_List"];

  // Fallbacks if other variants exist
  if (!v) {
    const possibleKeys = ['Locations','Sample_Locations','Countries','SampleCountries','Sample Sites','sites','locations'];
    for (const k of possibleKeys){
      if (meta[k] != null) { v = meta[k]; break; }
    }
  }
  if (!v) return 'various global sites';

  // Try to parse the Country_List format: "[\"SWE\", \"USA\"]"
  let arr = [];
  if (Array.isArray(v)) arr = v;
  else if (typeof v === 'string'){
    try {
      const parsed = JSON.parse(v);
      if (Array.isArray(parsed)) arr = parsed;
      else arr = v.split(',').map(s => s.trim());
    } catch {
      arr = v.split(',').map(s => s.trim());
    }
  }

  arr = arr.filter(Boolean);
  if (!arr.length) return 'various global sites';

  // Unique and trimmed
  const uniq = Array.from(new Set(arr.map(s => s.trim())));

  // Compose readable text
  const shown = uniq.slice(0,5).join(', ');
  if (uniq.length > 5) {
    const remaining = uniq.length - 5;
    return `${shown}, and ${remaining} other global site${remaining>1?'s':''}`;
  }
  return shown;
}
function parseUSGB(meta){
  const v = getMeta(meta, KEYMAP.uSGB);
  if (v == null) return null;
  const s = String(v).toLowerCase();
  return (s==='yes'||s==='true'||s==='1'||s==='unknown'||s==='novel') ? 'Yes' : 'No';
}
function westernLabel(meta){
  const v = parseWestern(meta);
  if (v === 'western') return 'Western';
  if (v === 'nonwestern') return 'Non-Western';
  const mode = meta?.Westernized_Mode ?? meta?.westernized_mode ?? null;
  if (mode) return String(mode);
  const list = getMeta(meta, KEYMAP.western);
  if (list != null) return Array.isArray(list) ? list.join(', ') : String(list);
  return '—';
}
function isWesternNo(meta){ return parseWestern(meta) === 'nonwestern'; }
function isWesternYes(meta){ return parseWestern(meta) === 'western'; }

/* Taxonomy helpers */
function getPhylum(d){
  if (d?.data?.phylum) return d.data.phylum;
  const ancestor = d.ancestors().find(n => n.depth === 2);
  if (ancestor){
    const parts = (ancestor.data.name||'').split("__");
    return parts.length>1 ? parts[1] : (ancestor.data.name||'Other');
  }
  return 'Other';
}
function prettyName(d){ const raw = (d?.data?.name||'').split("__").pop(); return raw ? raw.replace(/_/g,' ') : '(unnamed)'; }
function lineage(d){
  return d.ancestors().slice(0,-1).map(a=> (a.data.name||'').split('__').pop()?.replace(/_/g,' ') || '').filter(Boolean).reverse().join(' › ');
}
function safe(val, fb='—'){ return (val!==undefined && val!==null && val!=='' ? val : fb); }
function sgbLabel(d){ const nm = (d?.data?.name||'').split('__').pop() || ''; const m = nm.match(/SGB[_\s-]?(\d+)/i); return m ? `SGB ${m[1]}` : prettyName(d); }

/* ===== Mini-glyph & genomes ticks ===== */
function glyphPathFor(d){
  const chain = d.ancestors().reverse(); // root..leaf
  const yVals = chain.map(n => n.y);
  const yMin = Math.min(...yVals), yMax = Math.max(...yVals);
  const rMin = 12, rMax = 50;
  const line = d3.lineRadial()
    .curve(d3.curveBundle.beta(0.85))
    .angle(n => n.x)
    .radius(n => (yMax===yMin ? (rMin+rMax)/2 : rMin + (n.y - yMin)/(yMax - yMin) * (rMax - rMin)));
  return line(chain);
}
// Builds a fixed row of ticks; we fill a subset after insertion
function genomesTicksHTML(count, color){
  const maxTicks = 20; // one clean row
  let bars = '';
  for (let i = 0; i < maxTicks; i++) bars += '<span class="tick"></span>';
  return `
    <div class="genome-meter" data-count="${Math.max(0, count || 0)}" data-color="${color}" data-maxticks="${maxTicks}">
      <div class="ticks">${bars}</div>
      <div class="num"><span class="val">0</span> genomes identified</div>
    </div>
  `;
}

// After the tooltip’s HTML is injected, call this to fill ticks linearly and count up
function initGenomeMeter(){
  const meter = document.querySelector('#tooltip .genome-meter');
  if (!meter) return;

  const count = +meter.getAttribute('data-count') || 0;
  const color = meter.getAttribute('data-color') || '#fff';
  const maxTicks = +(meter.getAttribute('data-maxticks') || 20);
  const tickEls = Array.from(meter.querySelectorAll('.tick'));
  const valEl = meter.querySelector('.num .val');

  // Linear to P95 so low/medium values still fill visibly
  const denom = Math.max(1, TICK_DENOM);
  const fraction = Math.min(1, count / denom);
  const targetTicks = Math.max( (count > 0 ? 1 : 0), fraction * maxTicks );
  const ticksInt = Math.min(maxTicks, Math.round(targetTicks));

  // phylum color for filled ticks
  tickEls.forEach(t => t.style.setProperty('--tickColor', color));

  // ease-out animation for both ticks + number
  const dur = 500, t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const k = p * (2 - p); // easeOutQuad
    const n = Math.round(k * ticksInt);
    tickEls.forEach((t, i) => t.classList.toggle('filled', i < n));
    valEl.textContent = Math.round(k * count).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ===== Tooltip builders (simplified content) ===== */
function buildSummaryHTML(d){
  const phylum = getPhylum(d).replace(/_/g,' ');
  const meta = d?.data?.metadata || {};
  const rec = +meta["#_Reconstructed_genomes"] || 0;
  const loc = locationsFromMeta(meta);
  const sgb = sgbLabel(d);
  return `<div class="summary"><b>${sgb}</b> includes <b>${rec.toLocaleString()}</b> genomes within the <b>${phylum}</b> phylum, identified from <b>${loc}</b>.</div>`;
}
function buildTooltipHTML(d){
  const phylum = getPhylum(d);
  const meta = d?.data?.metadata || {};
  const rec = +meta["#_Reconstructed_genomes"] || 0;
  const status = (parseUSGB(meta) === 'Yes') ? 'Unknown' : '—';
  const geo = (parseWestern(meta) === 'western') ? 'Western' : (parseWestern(meta) === 'nonwestern' ? 'Non-Western' : '—');
  const leaf = !d.children;
  const color = colorMapping[phylum] || colorMapping.Other;
  const glyphStroke = color;

  /* Mini-glyph SVG */
  const glyphSVG = `
    <svg class="mini-glyph" viewBox="-60 -60 120 120" aria-hidden="true">
      <path d="${glyphPathFor(d)}" stroke="${glyphStroke}" />
    </svg>
  `;

  /* Genomes tick meter */
  const ticks = genomesTicksHTML(rec, color);

  return `
    <div class="tip-header">
      <div class="h-left">
        <span class="swatch" style="background:${color}"></span>
        <div>
          <div class="title">${sgbLabel(d)}</div>
          <div class="subtitle">${phylum.replace(/_/g,' ')}${lineage(d) ? ' • ' + lineage(d) : ''}</div>
        </div>
      </div>
      ${glyphSVG}
    </div>

    ${buildSummaryHTML(d)}
    ${ticks}

    <div class="kv">
      <div class="k">Status</div><div>${safe(status)}</div>
      <div class="k">Geography</div><div>${safe(geo)}</div>
    </div>

    ${leaf ? `<div class="actions">
      <button data-act="highlight">Highlight this species</button>
    </div>`:''}
  `;
}

/* ===== Tooltip behavior ===== */
const tip = document.getElementById('tooltip');
function positionTooltip(evt){
  const pad = 14, rect = tip.getBoundingClientRect();
  const tw = rect.width, th = rect.height;
  let x = evt.clientX + pad, y = evt.clientY - pad - th;
  if (y < 8) y = evt.clientY + pad;
  x = Math.min(Math.max(8, x), window.innerWidth  - tw - 8);
  y = Math.min(Math.max(8, y), window.innerHeight - th - 8);
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function showTooltip(d,evt){ tip.innerHTML = buildTooltipHTML(d); tip.classList.remove('hidden'); positionTooltip(evt); initGenomeMeter(); }
function hideTooltip(){ if (!pinnedDatum){ tip.classList.add('hidden'); tip.classList.remove('pinned'); } }
function pinTooltip(d){ pinnedDatum = d; tip.classList.add('pinned'); }
function unpinTooltip(){ pinnedDatum = null; hideTooltip(); }
function clearSelected(){ selectedLeafId = null; g.selectAll('.is-selected').classed('is-selected', false); }
function toggleClassForLeaf(id, cls, on=true){ if (id==null) return; g.selectAll(`[data-leaf-id="${id}"]`).classed(cls, on); }


/* Highlight logic (replaces "isolate") */
function clearHighlight(){
  highlightedLeaf = null;
  g.classed('isolated', false);
  g.selectAll('.node, .link, .bar, .usgb, .western, .sgb-line')
    .attr('opacity', null).style('pointer-events', null);
}
function highlightLeaf(d){
  highlightedLeaf = d;
  const keep = new Set(d.ancestors());
  keep.add(d);
  g.classed('isolated', true);
  g.selectAll('.node, .link, .bar, .usgb, .western, .sgb-line')
    .attr('opacity', datum => {
      // datum may be a link {source,target} or a node/leaf
      const nd = datum?.target ? datum.target : datum;
      return keep.has(nd) ? 1 : DIM_OPACITY;
    })
    .style('pointer-events', datum => {
      const nd = datum?.target ? datum.target : datum;
      return keep.has(nd) ? null : 'none';
    });
}

/* Attach handlers */
function attachTooltipHandlers(selection, accessor=(d)=>d){
  selection.classed('hover-target', true)
    .on('mousemove', function(evt,d){ if (!pinnedDatum){ const datum = accessor(d); if (tip.classList.contains('hidden')) showTooltip(datum, evt); else positionTooltip(evt);} })
    .on('mouseover', function(evt,d){ d3.select(this).classed('is-hover', true); const lid = this.getAttribute('data-leaf-id'); if (lid) toggleClassForLeaf(lid, 'is-hover', true); if(!pinnedDatum){ showTooltip(accessor(d), evt); } })
    .on('mouseout', function(){ d3.select(this).classed('is-hover', false); const lid = this.getAttribute('data-leaf-id'); if (lid) toggleClassForLeaf(lid, 'is-hover', false); hideTooltip(); })
    .on('click', function(evt,d){
      const datum = accessor(d), lid = this.getAttribute('data-leaf-id');
      if (pinnedDatum && pinnedDatum === datum){ unpinTooltip(); clearSelected(); evt.stopPropagation(); return; }
      pinTooltip(datum); showTooltip(datum, evt);
      if (lid){ clearSelected(); selectedLeafId = lid; toggleClassForLeaf(lid, 'is-selected', true); }
      evt.stopPropagation();
    });
}

/* ===== Filters ===== */
const filterState = { phyla: new Set(), unknown: false, western: 'any' };

function leafMatchesFilters(leaf){
  if (filterState.phyla.size){
    const ph = getPhylum(leaf);
    if (!filterState.phyla.has(ph)) return false;
  }
  if (filterState.unknown){ if (parseUSGB(leaf.data.metadata) !== 'Yes') return false; }
  if (filterState.western === 'western'){ if (!isWesternYes(leaf.data.metadata)) return false; }
  else if (filterState.western === 'nonwestern'){ if (!isWesternNo(leaf.data.metadata)) return false; }
  return true;
}
function computeKeepSet(root){
  const anyActive = filterState.phyla.size || filterState.unknown || filterState.western!=='any';
  if (!anyActive) return null;
  const matchedLeaves = root.leaves().filter(leafMatchesFilters);
  const keep = new Set();
  matchedLeaves.forEach(l=>{ l.ancestors().forEach(a=> keep.add(a)); keep.add(l); });
  return keep;
}
function applyFilters(){
  const { root, selections } = handles;
  if (!root) return;
  const keep = computeKeepSet(root);

  function styleDim(sel, isKept, isLabel=false){
    return sel.attr('opacity', d => isKept(d) ? 1 : (isLabel ? DIM_LABEL_OPACITY : DIM_OPACITY))
              .style('pointer-events', d => isKept(d) ? null : 'none');
  }
  if (keep === null){
    g.classed('isolated', false);
    selections.nodes.attr('opacity', null).style('pointer-events', null);
    selections.links.attr('opacity', null).style('pointer-events', null);
    selections.linkHits.attr('opacity', null).style('pointer-events', null);
    selections.bars.attr('opacity', null).style('pointer-events', null);
    selections.sgbLines.attr('opacity', null).style('pointer-events', null);
    selections.usgb.attr('opacity', null).style('pointer-events', null);
    selections.west.attr('opacity', null).style('pointer-events', null);
    selections.regions.attr('opacity', null).style('pointer-events', null);
    selections.internals.attr('opacity', null).style('pointer-events', null);
    selections.labels.attr('opacity', null).style('pointer-events', null);
    return;
  }
  g.classed('isolated', true);
  styleDim(selections.nodes,      d => keep.has(d));
  styleDim(selections.internals,  d => keep.has(d), true);
  styleDim(selections.links,      d => keep.has(d.target));
  styleDim(selections.linkHits,   d => keep.has(d.target));
  styleDim(selections.bars,       d => keep.has(d));
  styleDim(selections.sgbLines,   d => keep.has(d));
  styleDim(selections.usgb,       d => keep.has(d));
  styleDim(selections.west,       d => keep.has(d));
  styleDim(selections.regions,    d => keep.has(d));
  styleDim(selections.labels,     d => keep.has(d), true);
}

/* ===== Circular Filter sizing & behavior ===== */
const filterCircle = document.getElementById('filterCircle');
const ringSvg = document.getElementById('ringSvg');
const ring = document.getElementById('fc-ring');
const caption = document.getElementById('fc-caption');
const arcRight = document.getElementById('fc-arc-right');

const COLLAPSED_R = 80;
const IDEAL_EXPANDED_R = 420;
const VIEW_MARGIN = 28;

function maxRadiusForViewport(){
  const vw = Math.max(document.documentElement.clientWidth,  window.innerWidth  || 0);
  const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
  return Math.floor(Math.min(vw, vh)/2) - VIEW_MARGIN;
}
function setCircleRadius(r){
  /* ensure element actually resizes */
  filterCircle.style.setProperty('--R', r + 'px');
  filterCircle.style.width  = (r * 2) + 'px';
  filterCircle.style.height = (r * 2) + 'px';

  /* ring hugs edge */
  const STROKE = 3, CAPTION_PAD = 22;
  const rim = Math.max(12, r - STROKE/2);
  ring.setAttribute('r', rim);

  /* exact viewBox (no outer space) */
  ringSvg.setAttribute('viewBox', `${-r} ${-r} ${2*r} ${2*r}`);

  /* caption path inset */
  const inset = Math.max(10, r - STROKE - CAPTION_PAD);
  arcRight.setAttribute('d', `M 0 -${inset} A ${inset} ${inset} 0 0 1 0 ${inset}`);
}
function ensureCircleFits(){
  if (!filterCircle.classList.contains('expanded')) return;
  const sections = document.querySelector('#filterCircle .sections');
  if (!sections) return;

  const styles = getComputedStyle(filterCircle);
  const rPx = parseInt(styles.getPropertyValue('--R')) || IDEAL_EXPANDED_R;
  const innerDiameter = (rPx * 2) * 0.86;
  const sRect = sections.getBoundingClientRect();
  const tooWide = sRect.width > innerDiameter;
  const tooHigh = sRect.height > innerDiameter;

  if (tooWide || tooHigh){
    const cap = maxRadiusForViewport();
    if (rPx + 30 <= cap){
      setCircleRadius(rPx + 30);
      requestAnimationFrame(ensureCircleFits);
      return;
    }
    filterCircle.classList.add('compact');
    requestAnimationFrame(()=>{
      const currentPad = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--circlePad')) || 22;
      if (currentPad > 16){
        document.documentElement.style.setProperty('--circlePad', (currentPad - 4) + 'px');
        requestAnimationFrame(ensureCircleFits);
      }
    });
  } else {
    filterCircle.classList.remove('compact');
  }
}
function expandCircle(){
  filterCircle.classList.add('expanded');
  const startR = Math.min(IDEAL_EXPANDED_R, maxRadiusForViewport());
  setCircleRadius(startR);
  caption.style.opacity = 1;
  document.querySelector('.fc-expanded').setAttribute('aria-hidden','false');
  document.querySelector('.fc-collapsed').setAttribute('aria-hidden','true');
  requestAnimationFrame(ensureCircleFits);
}
function collapseCircle(){
  filterCircle.classList.remove('expanded', 'compact');
  setCircleRadius(COLLAPSED_R);
  caption.style.opacity = 0;
  document.querySelector('.fc-expanded').setAttribute('aria-hidden','true');
  document.querySelector('.fc-collapsed').setAttribute('aria-hidden','false');
}

/* Click-away collapses the circle */
window.addEventListener('click', (e)=>{
  const t = e.target;
  if (t.closest('#filterCircle') || t.closest('#settings') || t.closest('#tooltip') || t.closest('#menuToggle')) return;
  if (filterCircle.classList.contains('expanded')) collapseCircle();
  unpinTooltip(); clearSelected(); clearHighlight();
});
window.addEventListener('keydown', (e)=>{
  if (e.key==='Escape'){ if (filterCircle.classList.contains('expanded')) collapseCircle(); g.classed('isolated', false); g.selectAll('.node, .link, .bar, .usgb, .western, .sgb-line').attr('opacity', null).style('pointer-events', null); unpinTooltip(); clearSelected(); clearHighlight(); }
});
window.addEventListener('resize', ()=>{
  if (!filterCircle.classList.contains('expanded')) return;
  const rPx = parseInt(getComputedStyle(filterCircle).getPropertyValue('--R')) || IDEAL_EXPANDED_R;
  const cap = maxRadiusForViewport();
  if (rPx > cap) setCircleRadius(cap);
  requestAnimationFrame(ensureCircleFits);
});

/* Buttons */
document.getElementById('expandCircle').addEventListener('click', (e)=>{ e.stopPropagation(); expandCircle(); });
document.getElementById('collapseCircle').addEventListener('click', (e)=>{ e.stopPropagation(); collapseCircle(); });

/* ===== Render & chips ===== */
function render(size = 'full'){
  const dim = size==='full' ? fullSize : previewSize;
  const radius = size==='full' ? fullRadius : previewRadius;
  svg.attr('viewBox', `${-dim/2} ${-dim/2} ${dim} ${dim}`);
  g.selectAll('*').remove();
  defs.selectAll('*').remove();
  tree.size([2*Math.PI, radius]);

  d3.json('sgb_taxonomy_tree.json').then(data => {
    const root = d3.hierarchy(data);
    root.sort((a,b)=> b.descendants().length - a.descendants().length); tree(root);
    handles.root = root;

    const leaves = root.leaves(); leaves.forEach((d,i)=> d.leafId = i);

    // Phylum chips
    const allPhy = Array.from(new Set(leaves.map(getPhylum))).sort((a,b)=>a.localeCompare(b));
    const chipsWrap = document.getElementById('phylumChips');
    chipsWrap.innerHTML = '';
    allPhy.forEach(p=>{
      const color = colorMapping[p] || colorMapping.Other;
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.type='button';
      btn.textContent = p.replace(/_/g,' ');
      btn.dataset.phylum = p;
      btn.style.background = color;
      btn.style.color = pickTextColor(color);
      btn.style.borderColor = 'rgba(255,255,255,.25)';
      btn.addEventListener('click', ()=>{
        const on = btn.classList.toggle('active');
        if (on) filterState.phyla.add(p); else filterState.phyla.delete(p);
        applyFilters();
      });
      chipsWrap.appendChild(btn);
    });

    // Status / Geography bindings
    document.getElementById('unknownFilter').onchange = (e)=>{ filterState.unknown = e.target.checked; applyFilters(); };
    document.querySelectorAll('input[name="western"]').forEach(r=>{
      r.onchange = (e)=>{ if (e.target.checked){ filterState.western = e.target.value; applyFilters(); } };
    });

    // Select/Clear
    function selectAll(){
      filterState.phyla = new Set(allPhy);
      document.querySelectorAll('#phylumChips .chip').forEach(c=> c.classList.add('active'));
      applyFilters();
    }
    function clearAll(){
      filterState.phyla.clear(); filterState.unknown = false; filterState.western = 'any';
      document.getElementById('unknownFilter').checked = false;
      const anyRadio = document.querySelector('input[name="western"][value="any"]'); if (anyRadio) anyRadio.checked = true;
      document.querySelectorAll('#phylumChips .chip').forEach(c=> c.classList.remove('active'));
      applyFilters();
    }
    document.getElementById('selectAllChips').onclick = selectAll;
    document.getElementById('clearChips').onclick     = clearAll;

    /* ----- Viz drawing ----- */
    const angleWidth = 0.0005;
    const usgbInner = radius + 20;
    const usgbOuter = usgbInner + 24;
    const westInner = usgbOuter + 12;
    const westOuter = westInner + 24;

    // bar metrics (once)
    const reconstructedCounts = leaves.map(d => d.data.metadata?.["#_Reconstructed_genomes"] || 0);
    const maxRec = d3.max(reconstructedCounts) || 0;
    MAX_GENOME_COUNT = Math.max(1, maxRec);
    // NEW: use 95th percentile as denominator so ticks fill meaningfully
    const sortedCounts = reconstructedCounts.slice().sort((a,b)=>a-b);
    const p95 = d3.quantileSorted(sortedCounts, 0.95) || maxRec;
    TICK_DENOM = Math.max(1, Math.round(p95));

    const barMaxLength = radius * 0.05;
    const barScale = d3.scaleSymlog().domain([0, Math.max(1, maxRec)]).range([0, barMaxLength]).constant(1);
    const barInner = westOuter + 30;

    const line = d3.lineRadial().curve(d3.curveBundle.beta(currentTension)).angle(d=>d.x).radius(d=>d.y);

    // SGB lines + hits
    const sgbGroup = g.append('g');
    const sgbLines = sgbGroup.selectAll('path.sgb-line').data(leaves).join('path')
      .attr('class','sgb-line').attr('data-leaf-id', d=>d.leafId)
      .attr('d', d => {
        const theta = d.x - Math.PI/2;
        const x0 = Math.cos(theta)*d.y, y0 = Math.sin(theta)*d.y;
        const outerRadius = barInner + barScale(d.data.metadata?.["#_Reconstructed_genomes"]||0);
        const x1 = Math.cos(theta)*outerRadius, y1 = Math.sin(theta)*outerRadius;
        return `M${x0},${y0}L${x1},${y1}`;
      });
    const sgbHits = sgbGroup.selectAll('path.sgb-hit').data(leaves).join('path')
      .attr('class','hit sgb-hit').attr('data-leaf-id', d=>d.leafId)
      .attr('d', d => {
        const theta = d.x - Math.PI/2;
        const x0 = Math.cos(theta)*d.y, y0 = Math.sin(theta)*d.y;
        const outerRadius = barInner + barScale(d.data.metadata?.["#_Reconstructed_genomes"]||0);
        const x1 = Math.cos(theta)*outerRadius, y1 = Math.sin(theta)*outerRadius;
        return `M${x0},${y0}L${x1},${y1}`;
      });
    attachTooltipHandlers(sgbHits, d=>d);

    // Regions + labels
    const regionsLayer = g.append('g');
    const labelsLayer  = g.append('g');
    let id = 0; const maxDepth = d3.max(root.descendants(), d=>d.depth);
    const regionPaths = []; const labelEls = [];
    for (let depth=2; depth<=maxDepth; depth++){
      const nodes = root.descendants().filter(d=>d.depth===depth);
      d3.groups(nodes, d=>getPhylum(d)).forEach(([phylum, group]) => {
        if (group.length < 2) return;
        const sorted = group.sort((a,b)=>a.x-b.x);
        const innerR = sorted[0].y - (radius/maxDepth)*0.75;
        const outerR = sorted[0].y;
        const ptsOuter = sorted.map(d=>[d.x, outerR]);
        const ptsInner = sorted.map(d=>[d.x, innerR]).reverse();
        const pathData = d3.lineRadial().curve(d3.curveCardinalClosed.tension(.7))(ptsOuter.concat(ptsInner));
        const gradID = `grad-${phylum}-${depth}`;
        const gdef = defs.append('radialGradient').attr('id', gradID);
        gdef.selectAll('stop').data([
          {offset:'0%', color:backgroundColor, opacity:0},
          {offset:'100%', color: colorMapping[phylum]||colorMapping.Other, opacity:1}
        ]).join('stop').attr('offset', d=>d.offset).attr('stop-color', d=>d.color).attr('stop-opacity', d=>d.opacity);
        const bandNode = sorted[0];
        const region = regionsLayer.append('path').datum(bandNode).attr('class','region-path').attr('d', pathData).attr('fill', `url(#${gradID})`);
        regionPaths.push(region.node());
        const arcID = `arc-${id++}`;
        defs.append('path').attr('id', arcID).attr('d', d3.arc()({innerRadius: outerR-12, outerRadius: outerR-12, startAngle: sorted[0].x, endAngle: sorted[sorted.length-1].x }));
        const labelText = labelsLayer.append('text').attr('class','region-label');
        labelText.append('textPath').attr('xlink:href',`#${arcID}`).attr('startOffset','50%').text(phylum.replace(/_/g,' '));
        labelEls.push(labelText.node());
      });
    }

    // Links + hits
    const linkData = root.links().filter(d=>!d.target.children);
    const links = g.append('g').selectAll('path.link').data(linkData).join('path')
      .attr('class','link').attr('data-leaf-id', d=>d.target.leafId)
      .attr('d', d=> line(d.target.ancestors().reverse()));
    const linkHits = g.append('g').selectAll('path.hit-link').data(linkData).join('path')
      .attr('class','hit').attr('data-leaf-id', d=>d.target.leafId)
      .attr('d', d=> line(d.target.ancestors().reverse()));
    attachTooltipHandlers(linkHits, d=>d.target);

    // Nodes
    const nodes = g.append('g').selectAll('g.node').data(root.descendants()).join('g')
      .attr('class','node').attr('data-leaf-id', d=> d.children ? null : d.leafId)
      .attr('transform', d=>`rotate(${d.x*180/Math.PI-90}) translate(${d.y},0)`);
    nodes.append('circle').attr('r', d=> d.children? 0 : 2.5).attr('fill', d=> colorMapping[getPhylum(d)]||colorMapping.Other);
    attachTooltipHandlers(nodes, d=>d);

    // Internal labels
    const internals = g.append('g').selectAll('text.internal-label').data(root.descendants().filter(d=>d.children)).join('text')
      .attr('class','internal-label')
      .attr('transform', d => `rotate(${d.x*180/Math.PI-90}) translate(${d.y},0)` + (d.x>=Math.PI? ' rotate(180)':''))
      .attr('dy','0.31em').attr('x', d=> d.x < Math.PI ? 6 : -6).attr('text-anchor', d=> d.x < Math.PI ? 'start' : 'end')
      .text(d=> (d.data.name||'').split('__').pop().replace(/_/g,' '));

    // Bars
    const bars = g.append('g').selectAll('path.bar').data(leaves).join('path')
      .attr('class','bar').attr('data-leaf-id', d=>d.leafId)
      .attr('d', d => {
        const count = d.data.metadata?.["#_Reconstructed_genomes"] || 0;
        const r0 = barInner, r1 = barInner + barScale(count);
        return d3.arc()({innerRadius:r0, outerRadius:r1, startAngle: d.x - 0.0005, endAngle: d.x + 0.0005});
      })
      .attr('fill', d=> colorMapping[getPhylum(d)]||colorMapping.Other);
    attachTooltipHandlers(bars);

    // Bar axis
    const axisGroup = g.append('g').attr('class','bar-axis');
    axisGroup.append('line').attr('x1',0).attr('y1',barInner).attr('x2',0).attr('y2',barInner+barMaxLength).attr('stroke','white');
    [1,10,100,500].filter(v=>v<=maxRec).forEach(t=>{
      const y = barInner + barScale(t);
      axisGroup.append('line').attr('x1',0).attr('y1',y).attr('x2',8).attr('y2',y);
      axisGroup.append('text').attr('x',10).attr('y',y).attr('dy','.32em').text(t);
    });

    // Unknown & Western rings
    const usgb = g.append('g').selectAll('path.usgb').data(leaves).join('path')
      .attr('class','usgb').attr('data-leaf-id', d=>d.leafId)
      .attr('d', d=> d3.arc()({innerRadius:usgbInner, outerRadius:usgbOuter, startAngle:d.x-0.0005, endAngle:d.x+0.0005}))
      .attr('fill', d=> (parseUSGB(d.data.metadata) === 'Yes') ? 'white' : 'black')
      .attr('opacity', d=> (parseUSGB(d.data.metadata) === 'Yes') ? 1 : .5);
    attachTooltipHandlers(usgb);
    g.append('circle').attr('r', (usgbInner+usgbOuter)/2).attr('fill','none').attr('stroke','white').attr('stroke-width',2);

    const west = g.append('g').selectAll('path.western').data(leaves).join('path')
      .attr('class','western').attr('data-leaf-id', d=>d.leafId)
      .attr('d', d=> d3.arc()({innerRadius:westInner, outerRadius:westOuter, startAngle:d.x-0.0005, endAngle:d.x+0.0005}))
      .attr('fill', d => isWesternNo(d.data.metadata) ? 'white' : 'black')
      .attr('opacity', d => isWesternNo(d.data.metadata) ? 1 : 0.5);
    attachTooltipHandlers(west);
    g.append('circle').attr('r', (westInner+westOuter)/2).attr('fill','none').attr('stroke','white').attr('stroke-width',2);

    // Store selections for filtering/highlight
    handles.selections = {
      nodes, internals, links, linkHits, bars, sgbLines, usgb, west,
      regions: d3.selectAll(regionsLayer.selectAll('path').nodes()),
      labels:  d3.selectAll(labelsLayer.selectAll('text').nodes())
    };

    applyFilters();
    requestAnimationFrame(ensureCircleFits);
  });
}

/* Settings + export */
document.getElementById('menuToggle').addEventListener('click', ()=>{ document.getElementById('settings').classList.toggle('open'); });
d3.select('#tensionSlider').on('input', function(){ currentTension = +this.value; d3.select('#tensionLabel').text(currentTension.toFixed(2)); render(currentSize); });
d3.select('#viewMode').on('change', function(){ currentSize = this.value; render(currentSize); });
d3.select('#export').on('click', exportSVG);

function exportSVG(){
  const dim = currentSize==='full' ? fullSize : previewSize;
  const clone = svg.node().cloneNode(true);
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', -dim/2); rect.setAttribute('y', -dim/2); rect.setAttribute('width', dim); rect.setAttribute('height', dim); rect.setAttribute('fill', backgroundColor);
  clone.insertBefore(rect, clone.firstChild);
  clone.querySelectorAll('*').forEach(el=>{
    const cs = getComputedStyle(el); let style = '';
    for (let i=0; i<cs.length; i++){ const prop = cs[i]; if(!prop.startsWith('-')) style += `${prop}:${cs.getPropertyValue(prop)};`; }
    el.setAttribute('style', style);
  });
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `radial_tree_export_${currentSize}.svg`; a.click(); URL.revokeObjectURL(url);
}

/* Init */
collapseCircle();  // start collapsed
render('full');
</script>
