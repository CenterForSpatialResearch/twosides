<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loading…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Pelikan";
      src: url("./fonts/ABCPelikan-Regular-Trial.woff") format("woff");
      font-display: swap;
    }

    :root{
      --bg:#0e0b16;
      --fg:#ffffff;
      --ring:#ffffff;
      --ringWidth: 3px;
      /* Fixed design canvas — see src/shared/pageStage.js. Same values as the
         splash so the disk does not jump size across the hand-off. */
      --design-w: 3000;
      --design-h: 2000;
      --stage-scale: 1;
      --disk: 900px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pelikan", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    body { animation: fadeIn 0.6s ease-out; }

    /* ===== Fixed-canvas scaling — mirrors index.html and shared/styles.css ===== */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      background: var(--bg);
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center;
      display: grid;
      place-items: center;
    }

    .disk-area {
      position: relative;
      width: var(--disk);
      height: var(--disk);
    }

    /* Static ring — no coin, no image, no rotation. Just the outline. */
    .disk-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: var(--ringWidth) solid var(--ring);
      box-shadow: 0 0 60px rgba(0,0,0,0.55);
      background: var(--bg);
      overflow: hidden;
    }

    .face-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }
    .face-svg text {
      fill: var(--fg);
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    .caption-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .caption-svg text {
      fill: var(--fg);
    }
    .caption-svg text.title {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .caption-svg text.subhead {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }
    /* Dots always take their slot; only opacity changes so the LOADING text
       never shifts as the ellipsis animates. */
    .dot.on  { opacity: 1; }
    .dot.off { opacity: 0.18; }
  </style>
</head>
<body>
  <div class="viewport">
  <div class="stage">
    <div class="disk-area">
      <svg class="caption-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
        <defs>
          <!-- Title arcs (adaptive — same as home: halfway between disk edge
               and viewport edge). Both use sweep=1 for the short arc. -->
          <path id="arc-title-left"  d="" />
          <path id="arc-title-right" d="" />

          <!-- Subheadline: bottom outer semicircle at r=590 (same slot as
               home's bottom one-liner). Ascenders point inward, upright at
               the 6 o'clock midpoint reading L→R. -->
          <path id="arc-subhead" d="M -590 0 A 590 590 0 0 0 590 0" />
        </defs>

        <text id="label-left"  class="title"><textPath href="#arc-title-left"  startOffset="50%" text-anchor="middle"></textPath></text>
        <text id="label-right" class="title"><textPath href="#arc-title-right" startOffset="50%" text-anchor="middle"></textPath></text>
        <text id="subheadline" class="subhead"><textPath href="#arc-subhead"    startOffset="50%" text-anchor="middle"></textPath></text>
      </svg>

      <div class="disk-ring">
        <svg class="face-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
          <defs>
            <!-- Inside-disk arcs at r=440: TOP (sweep=1, letters outward) and
                 BOTTOM (sweep=0, letters inward). r=440 gives enough arc
                 length for the long anthromes definition to fit at font 22+. -->
            <path id="arc-inside-top"    d="M -440 0 A 440 440 0 0 1 440 0" />
            <path id="arc-inside-bottom" d="M -440 0 A 440 440 0 0 0 440 0" />
          </defs>
          <text id="inside-top"><textPath href="#arc-inside-top"    startOffset="50%" text-anchor="middle"></textPath></text>
          <text id="inside-bot"><textPath href="#arc-inside-bottom" startOffset="50%" text-anchor="middle"></textPath></text>
        </svg>
      </div>
    </div>
  </div>
  </div>

  <script type="module">
    // Cross-link interstitial. The splash no longer routes through here — it
    // runs the same transition in place (see src/splash/narrative.js) so that
    // entering a side is one navigation, not two. What is left is the
    // biomes <-> anthromes hand-off, where a full page load is unavoidable and
    // this screen covers it with the destination's own framing.
    import { initPageStage } from './src/shared/pageStage.js';
    import {
      SIDE_COPY, BASE_FONT, TITLE_FONT, ARC_INSIDE,
      fitToArc, buildLoadingLabel
    } from './src/shared/splashCopy.js';

    initPageStage();

    // --- Route params -------------------------------------------------------
    // side= picks the copy + target viz. Any other params (country, highlightSGB,
    // etc.) get forwarded verbatim to the target so cross-linking preserves state.
    const params = new URLSearchParams(window.location.search);
    const side = params.get('side') === 'anthromes' ? 'anthromes' : 'biomes';
    params.delete('side');
    const forwardQuery = params.toString();

    const BASE = document.querySelector('meta[name="base-url"]')?.content
      || location.pathname.replace(/[^\/]*$/, '');

    const d = SIDE_COPY[side];
    const target = BASE + d.path + (forwardQuery ? '?' + forwardQuery : '');

    // --- References ---------------------------------------------------------
    const labelLeft   = document.getElementById('label-left');
    const labelRight  = document.getElementById('label-right');
    const labelLeftP  = labelLeft.querySelector('textPath');
    const labelRightP = labelRight.querySelector('textPath');
    const subhead     = document.getElementById('subheadline');
    const subheadP    = subhead.querySelector('textPath');
    const insideTop   = document.getElementById('inside-top');
    const insideTopP  = insideTop.querySelector('textPath');
    const insideBot   = document.getElementById('inside-bot');
    const insideBotP  = insideBot.querySelector('textPath');

    // --- Content placement --------------------------------------------------
    const titleP = d.titlePos === 'left' ? labelLeftP  : labelRightP;
    const loadP  = d.titlePos === 'left' ? labelRightP : labelLeftP;
    titleP.textContent = d.title;
    subheadP.textContent = d.subhead;
    const tickDots = buildLoadingLabel(loadP);

    // --- Adaptive title arc (same formula as the splash) --------------------
    // Anchored to the fixed design canvas, not the window: the page is authored
    // 1:1 against DESIGN_W and scaled by one transform, so this is a constant
    // and is measured once rather than on every resize.
    const DESIGN_W = 3000;

    function updateTitleArcs() {
      // Layout width, so the .stage transform doesn't enter into it.
      const diskWidth = document.querySelector('.disk-area').offsetWidth;
      if (!diskWidth) return;
      const r = Math.round(250 * (DESIGN_W / diskWidth + 1));
      const off = (r * Math.SQRT1_2).toFixed(2);
      document.getElementById('arc-title-left').setAttribute('d',
        `M -${off} ${off} A ${r} ${r} 0 0 1 -${off} -${off}`);
      document.getElementById('arc-title-right').setAttribute('d',
        `M ${off} -${off} A ${r} ${r} 0 0 1 ${off} ${off}`);
    }

    function sizeAll() {
      updateTitleArcs();
      labelLeft.setAttribute('font-size',  TITLE_FONT);
      labelRight.setAttribute('font-size', TITLE_FONT);
      subhead.setAttribute('font-size',    BASE_FONT);
      // Match both inside lines to the smaller of the two so the hierarchy
      // reads uniformly rather than one definition outranking the other.
      const fTop = fitToArc(insideTop, insideTopP, d.insideTop, ARC_INSIDE);
      const fBot = fitToArc(insideBot, insideBotP, d.insideBottom, ARC_INSIDE);
      const insideFont = Math.min(fTop, fBot);
      insideTop.setAttribute('font-size', insideFont);
      insideBot.setAttribute('font-size', insideFont);
    }

    // --- Preload hook + fixed wait ------------------------------------------
    // Lightweight prefetch to warm the browser HTTP cache. No iframe: running
    // the viz off-screen while our loading screen is up caused resource
    // contention and racing double-fetches. `rel=prefetch` + a fire-and-forget
    // fetch are both idle-priority hints that let the browser cache the target
    // HTML without executing it.
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = target;
    link.as = 'document';
    document.head.appendChild(link);
    fetch(target, { credentials: 'same-origin' }).catch(() => {});

    // Fixed 5s reading window. Both Apps show a plain dark background rather
    // than their own loading text, so any residual load time after the redirect
    // is visually continuous with this screen.
    const MIN_WAIT_MS = 5000;

    function boot() {
      // Measured once: on the fixed canvas every input to sizeAll() is a
      // constant, and the window only changes the scale pageStage.js applies.
      sizeAll();
      const dotTimer = setInterval(tickDots, 450);
      setTimeout(() => {
        clearInterval(dotTimer);
        // replace(), not href: this screen swaps ITSELF out of the history
        // stack for the target, so Back from the destination returns to the
        // page that linked here rather than landing on an interstitial that
        // immediately forwards again.
        window.location.replace(target);
      }, MIN_WAIT_MS);
    }

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
    else boot();
  </script>
</body>
</html>
