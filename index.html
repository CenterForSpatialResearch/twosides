<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anthromes &amp; Biomes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Pelikan";
      src: url("./fonts/ABCPelikan-Regular-Trial.woff") format("woff");
      font-display: swap;
    }

    :root{
      --bg:#0e0b16;
      --fg:#ffffff;
      --muted:#cfd3e0;
      --ring:#ffffff;
      --ringWidth: 3px;
      --disk: min(70vmin, 860px);
      --diskR: calc(var(--disk) / 2);
      --captionSize: clamp(14px, 1.6vw, 22px);
      --period: 10s;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pelikan", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fixed vertical side labels — always clickable */
    .sideLink {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--fg);
      user-select: none;
      text-decoration: none;
      z-index: 5;
      transition: opacity .4s ease;
    }
    #leftLink  { left: 24px; }
    #rightLink { right: 24px; }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    /* Central clickable target (disk + surrounding caption area) */
    .enter {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 2;
    }

    /* ---- Coin ---- */
    .coin-wrap {
      width: var(--disk);
      height: var(--disk);
      perspective: 2200px;
    }
    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: var(--ringWidth) solid var(--ring);
      box-shadow: 0 0 60px rgba(0,0,0,0.55);
      background: var(--bg);
    }
    .face--anthromes { transform: rotateY(180deg); }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---- Captions outside the ring (two cross-fading layers) ---- */
    .caption-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      will-change: opacity;
    }
    .cap {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20vw;
      max-width: 320px;
      font-size: var(--captionSize);
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.35;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cap--left  { right: calc(50% + var(--diskR) + 2.5vw); text-align: right; }
    .cap--right { left:  calc(50% + var(--diskR) + 2.5vw); text-align: left;  }
    .cap--enter { color: var(--fg); font-weight: 700; }

    @media (max-width: 720px) {
      .cap { width: 30vw; }
      .cap--left  { right: calc(50% + var(--diskR) + 12px); }
      .cap--right { left:  calc(50% + var(--diskR) + 12px); }
    }
  </style>
</head>
<body>
  <a id="leftLink"  class="sideLink" href="src/biomes/">BIOMES</a>
  <a id="rightLink" class="sideLink" href="src/anthromes/">ANTHROMES</a>

  <div class="stage">
    <!-- Biomes caption set -->
    <div class="caption-layer" id="cap-biomes">
      <div class="cap cap--left">AN EXTENSIVE HUMAN MICROBIOME</div>
      <div class="cap cap--right cap--enter">CLICK TO ENTER</div>
    </div>
    <!-- Anthromes caption set -->
    <div class="caption-layer" id="cap-anthromes">
      <div class="cap cap--left cap--enter">CLICK TO ENTER</div>
      <div class="cap cap--right">MODELING 12,025 YEARS OF LAND USE</div>
    </div>

    <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter the currently shown visualization">
      <div class="coin-wrap">
        <div class="coin" id="coin">
          <div class="face face--biomes"><img src="splash/biomes.webp" alt="Biomes visualization" /></div>
          <div class="face face--anthromes"><img src="splash/anthromes.webp" alt="Anthromes visualization" /></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const URLS = { biomes: 'src/biomes/', anthromes: 'src/anthromes/' };

    const coin       = document.getElementById('coin');
    const capBiomes  = document.getElementById('cap-biomes');
    const capAnthro  = document.getElementById('cap-anthromes');
    const leftLink   = document.getElementById('leftLink');   // BIOMES
    const rightLink  = document.getElementById('rightLink');  // ANTHROMES
    const enter      = document.getElementById('enter');

    const PERIOD = 10000;            // ms for a full 360° turn (5s per face)
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let currentFace = 'biomes';
    let faceStart = performance.now();
    let startT = performance.now();

    // V-shaped dip for the non-showing side label: 100% → 50% (first ~1.5s) → 100%.
    function dip(p) {
      const OUT = 0.3; // fraction of the 5s spent fading out
      return p < OUT ? 1 - 0.5 * (p / OUT) : 0.5 + 0.5 * ((p - OUT) / (1 - OUT));
    }

    function render(now) {
      const t = (now - startT) % PERIOD;
      const angle = (t / PERIOD) * 360;
      coin.style.transform = `rotateY(${angle}deg)`;

      const c = Math.cos(angle * Math.PI / 180);   // >0 → biomes faces viewer
      const face = c >= 0 ? 'biomes' : 'anthromes';
      if (face !== currentFace) { currentFace = face; faceStart = now; }

      // Captions cross-fade with the flip (sharpened so they're readable most of the face)
      const sharpen = x => Math.min(1, Math.max(0, x) * 1.8);
      capBiomes.style.opacity = sharpen(c);
      capAnthro.style.opacity = sharpen(-c);

      // Side labels: showing side full, non-showing dips to 50% then recovers
      const p = Math.min(1, (now - faceStart) / (PERIOD / 2));
      if (face === 'biomes') { leftLink.style.opacity = 1; rightLink.style.opacity = dip(p); }
      else                   { rightLink.style.opacity = 1; leftLink.style.opacity = dip(p); }

      rafId = requestAnimationFrame(render);
    }

    let rafId;
    if (reduce) {
      // Hold on the biomes face; side labels remain usable
      coin.style.transform = 'rotateY(0deg)';
      capBiomes.style.opacity = 1;
      currentFace = 'biomes';
    } else {
      rafId = requestAnimationFrame(render);
    }

    function go(which) { window.location.href = URLS[which]; }

    // Click the disk / caption area → whichever viz is currently facing us
    enter.addEventListener('click', () => go(currentFace));
    enter.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(currentFace); }
    });

    // Side labels always route to their own side (don't also trigger the disk click)
    leftLink.addEventListener('click', (e) => e.stopPropagation());
    rightLink.addEventListener('click', (e) => e.stopPropagation());
  </script>
</body>
</html>
