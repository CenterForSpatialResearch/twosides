<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anthromes &amp; Biomes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Pelikan";
      src: url("./fonts/ABCPelikan-Regular-Trial.woff") format("woff");
      font-display: swap;
    }

    :root{
      --bg:#0e0b16;
      --fg:#ffffff;
      --muted:#cfd3e0;
      --ring:#ffffff;
      --ringWidth: 3px;
      --disk: min(70vmin, 860px);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pelikan", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fixed vertical side labels — always clickable; opacity tracks the coin's rotation */
    .sideLink {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--fg);
      user-select: none;
      text-decoration: none;
      z-index: 5;
      will-change: opacity;
    }
    #leftLink  { left: 24px; }
    #rightLink { right: 24px; }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .disk-area {
      position: relative;
      width: var(--disk);
      height: var(--disk);
    }

    /* Central clickable target: disk + the radial caption ring around it */
    .enter {
      position: absolute;
      inset: -24%;
      cursor: pointer;
      z-index: 2;
    }

    /* ---- Coin ---- */
    .coin-wrap {
      position: absolute;
      inset: 0;
      perspective: 2200px;
    }
    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: var(--ringWidth) solid var(--ring);
      box-shadow: 0 0 60px rgba(0,0,0,0.55);
      background: var(--bg);
    }
    .face--anthromes { transform: rotateY(180deg); }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---- Radial captions, curved along the ring outside the disk ---- */
    .caption-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .caption-svg text {
      fill: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      will-change: opacity;
    }
    .caption-svg text.enter-text {
      fill: var(--fg);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <a id="leftLink"  class="sideLink" href="src/biomes/">BIOMES</a>
  <a id="rightLink" class="sideLink" href="src/anthromes/">ANTHROMES</a>

  <div class="stage">
    <div class="disk-area">
      <svg class="caption-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
        <defs>
          <path id="arc-left"  d="M 0 -575 A 575 575 0 0 0 0 575" />
          <path id="arc-right" d="M 0 575 A 575 575 0 0 0 0 -575" />
        </defs>

        <!-- Biomes face captions -->
        <text id="cap-biomes-left" font-size="30">
          <textPath href="#arc-left" startOffset="50%" text-anchor="middle">AN EXTENSIVE HUMAN MICROBIOME</textPath>
        </text>
        <text id="cap-biomes-right" class="enter-text" font-size="30">
          <textPath href="#arc-right" startOffset="50%" text-anchor="middle">CLICK TO ENTER</textPath>
        </text>

        <!-- Anthromes face captions -->
        <text id="cap-anthromes-left" class="enter-text" font-size="30">
          <textPath href="#arc-left" startOffset="50%" text-anchor="middle">CLICK TO ENTER</textPath>
        </text>
        <text id="cap-anthromes-right" font-size="30">
          <textPath href="#arc-right" startOffset="50%" text-anchor="middle">MODELING 12,025 YEARS OF LAND USE</textPath>
        </text>
      </svg>

      <div class="coin-wrap">
        <div class="coin" id="coin">
          <div class="face face--biomes"><img src="splash/biomes.webp" alt="Biomes visualization" /></div>
          <div class="face face--anthromes"><img src="splash/anthromes.webp" alt="Anthromes visualization" /></div>
        </div>
      </div>

      <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter the currently shown visualization"></div>
    </div>
  </div>

  <script>
    const URLS = { biomes: 'src/biomes/', anthromes: 'src/anthromes/' };

    const coin           = document.getElementById('coin');
    const capBiomesLeft   = document.getElementById('cap-biomes-left');
    const capBiomesRight  = document.getElementById('cap-biomes-right');
    const capAnthroLeft   = document.getElementById('cap-anthromes-left');
    const capAnthroRight  = document.getElementById('cap-anthromes-right');
    const leftLink        = document.getElementById('leftLink');   // BIOMES
    const rightLink       = document.getElementById('rightLink');  // ANTHROMES
    const enter           = document.getElementById('enter');

    const PERIOD = 10000; // ms for a full 360° turn (5s per face)
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let currentFace = 'biomes';
    let startT = performance.now();
    let rafId;

    function render(now) {
      const t = (now - startT) % PERIOD;
      const angle = (t / PERIOD) * 360;
      coin.style.transform = `rotateY(${angle}deg)`;

      const c = Math.cos(angle * Math.PI / 180); // 1 = biomes facing, -1 = anthromes facing
      currentFace = c >= 0 ? 'biomes' : 'anthromes';

      // Captions cross-fade with the flip (sharpened so they're readable across most of the face)
      const sharpen = x => Math.min(1, Math.max(0, x) * 1.8);
      const biomesOpacity = sharpen(c);
      const anthromesOpacity = sharpen(-c);
      capBiomesLeft.style.opacity = biomesOpacity;
      capBiomesRight.style.opacity = biomesOpacity;
      capAnthroLeft.style.opacity = anthromesOpacity;
      capAnthroRight.style.opacity = anthromesOpacity;

      // Side labels fade continuously with rotation: 1 when that side is facing,
      // dropping to 0.75 at the opposite extreme (when the other face is fully shown).
      leftLink.style.opacity  = 0.7 + 0.3 * c;
      rightLink.style.opacity = 0.7 - 0.3 * c;

      rafId = requestAnimationFrame(render);
    }

    if (reduce) {
      // Hold on the biomes face; side labels remain fully visible
      coin.style.transform = 'rotateY(0deg)';
      capBiomesLeft.style.opacity = 1;
      capBiomesRight.style.opacity = 1;
      capAnthroLeft.style.opacity = 0;
      capAnthroRight.style.opacity = 0;
      currentFace = 'biomes';
    } else {
      rafId = requestAnimationFrame(render);
    }

    function go(which) { window.location.href = URLS[which]; }

    // Click the disk / caption ring → whichever viz is currently facing us
    enter.addEventListener('click', () => go(currentFace));
    enter.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(currentFace); }
    });

    // Side labels always route to their own side (don't also trigger the disk click)
    leftLink.addEventListener('click', (e) => e.stopPropagation());
    rightLink.addEventListener('click', (e) => e.stopPropagation());
  </script>
</body>
</html>
