<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anthromes &amp; Biomes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Pelikan";
      src: url("./fonts/ABCPelikan-Regular-Trial.woff") format("woff");
      font-display: swap;
    }

    :root{
      --bg:#0e0b16;
      --fg:#ffffff;
      --muted:#cfd3e0;
      --ring:#ffffff;
      --ringWidth: 3px;
      /* Fixed design canvas — see src/shared/pageStage.js. Everything below is
         authored in design px against 3000x2000 and scaled by one transform. */
      --design-w: 3000;
      --design-h: 2000;
      /* Set from JS on load + resize; CSS can't divide length/length. */
      --stage-scale: 1;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pelikan", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    /* ===== Fixed-canvas scaling =====
       .viewport fills the real window and supplies the letterbox background;
       .stage is the 1:1 design canvas. Mirrors the .viewport/.stage pair in
       src/shared/styles.css so the splash letterboxes exactly like the two
       visualizations it leads into. */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      /* pageStage.js swaps this for blue when we're off-target. */
      background: var(--letterbox-bg, var(--bg));
    }

    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      background: var(--bg);
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center;
    }

    /* The active arrangement is cloned in here — see the controller at the
       bottom of the file. Only ever one at a time, so the ids inside each
       template are unique at runtime. */
    #splash-host,
    .splash {
      position: absolute;
      inset: 0;
    }
    .splash {
      display: grid;
      place-items: center;
    }

    /* Both arrangements were sized with min(Nvmin, Npx). On the 3000x2000
       target each already resolved to its px cap, so pinning the cap here
       changes nothing on the display the piece actually runs on — it just stops
       the disk chasing the browser window now that the canvas sets the scale. */
    .splash--narrative { --disk: 900px; }  /* was min(66vmin, 900px) */
    .splash--classic   { --disk: 860px; }  /* was min(70vmin, 860px) */

    /* ---- Shared: disk + coin ---- */
    .disk-area {
      position: relative;
      width: var(--disk);
      height: var(--disk);
    }

    .enter {
      position: absolute;
      cursor: pointer;
      z-index: 2;
    }
    /* Central clickable target: the disk plus the caption ring around it. The
       narrative screen hangs its titles much further out, so its target is
       correspondingly wider. */
    .splash--narrative .enter { inset: -50%; }
    .splash--classic   .enter { inset: -24%; }

    .coin-wrap {
      position: absolute;
      inset: 0;
      perspective: 2200px;
    }
    .coin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: var(--ringWidth) solid var(--ring);
      box-shadow: 0 0 60px rgba(0,0,0,0.55);
      background: var(--bg);
    }
    .face--anthromes { transform: rotateY(180deg); }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .caption-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }

    /* ---- Narrative arrangement (option 1) ---- */
    .splash--narrative .face-dim {
      position: absolute;
      inset: 0;
      background: rgba(14, 11, 22, 0.62);
      z-index: 1;
      pointer-events: none;
    }

    .splash--narrative .face-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }
    .splash--narrative .face-svg text {
      fill: var(--fg);
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    .splash--narrative .caption-svg text {
      fill: var(--fg);
      will-change: opacity;
    }
    .splash--narrative .caption-svg text.title {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .splash--narrative .caption-svg text.line {
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    /* The destination's subheadline, shown once a side has been chosen. Same
       treatment as loading.html's, so the commit state and the cross-link
       interstitial are the same screen. */
    .splash--narrative .caption-svg text.subhead {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Both titles are always clickable, whichever face is turned forward —
       clicking ANTHROMES while biomes is showing enters anthromes. Arced SVG
       glyphs are a poor hit target, so each title gets an invisible band along
       its own arc: stroke-only, wide enough to cover the text's full height
       (ascenders run outward from the path), and hit-tested on the stroke.
       .caption-svg is pointer-events:none, which stops the layer itself
       swallowing clicks meant for the disk while still letting these children
       opt back in. */
    .splash--narrative .title-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 130;
      pointer-events: stroke;
      cursor: pointer;
    }

    /* Dots always take their slot; only opacity changes, so LOADING never
       shifts along the arc as the ellipsis animates. */
    .splash--narrative .dot.on  { opacity: 1; }
    .splash--narrative .dot.off { opacity: 0.18; }

    /* ---- Classic arrangement (options 2+) ---- */
    /* Fixed vertical side labels — always clickable; opacity tracks rotation.
       position:absolute, not fixed: the design canvas is the frame now, so they
       anchor to its edges and scale with everything else. */
    .splash--classic .sideLink {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      /* was clamp(30px, 4vw, 52px); 4vw of the 3000px canvas clamps to the max */
      font-size: 52px;
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--fg);
      user-select: none;
      text-decoration: none;
      z-index: 5;
      will-change: opacity;
    }
    .splash--classic #leftLink  { left: 24px; }
    .splash--classic #rightLink { right: 24px; }

    .splash--classic .caption-svg text {
      fill: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      will-change: opacity;
    }
    .splash--classic .caption-svg text.enter-text {
      fill: var(--fg);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <div id="splash-host"></div>
    </div>
  </div>

  <!-- ===== Option 1: 8-21 narrative updates ===== -->
  <template id="tpl-narrative">
    <div class="splash splash--narrative">
      <div class="disk-area">
        <svg class="caption-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
          <defs>
            <!--
              TITLES: outside the disk at 3 and 9 o'clock, 90° span centered on
              the horizontal axis. Both use sweep=1 to take the SHORT arc past
              9 / 3 respectively — an earlier version had BIOMES taking the long
              arc via 12, planting text on top of the disk. The radius is set
              from the canvas at mount time (see narrative.js); the d= here is
              only a sensible starting shape.
                BIOMES    arc: 7:30 up through 9 to 10:30
                ANTHROMES arc: 1:30 down through 3 to 4:30
              Ascenders point outward, away from the disk center.
            -->
            <path id="arc-title-left"
                  d="M -459.62 459.62 A 650 650 0 0 1 -459.62 -459.62" />
            <path id="arc-title-right"
                  d="M 459.62 -459.62 A 650 650 0 0 1 459.62 459.62" />

            <!--
              ONE-LINERS: outside the disk, alternating between TOP and BOTTOM
              semicircles at r=590 (just past the disk edge, inside the title
              ring). The 180° span meets each title at its endpoint (9 or 3), so
              the one-liner reads as a continuation of the framing hierarchy.
                TOP arc: L→R across the top; ascenders point OUTWARD (up, away
                  from the disk). Upright letters at the 12 o'clock midpoint.
                BOTTOM arc: L→R across the bottom (the path traverses 9→6→3,
                  which is CCW on the clock face); ascenders point INWARD, and
                  letters are upright at the 6 o'clock midpoint.
            -->
            <path id="arc-line-top"
                  d="M -590 0 A 590 590 0 0 1 590 0" />
            <path id="arc-line-bottom"
                  d="M -590 0 A 590 590 0 0 0 590 0" />
          </defs>

          <text id="label-biomes"    class="title"><textPath href="#arc-title-left"  startOffset="50%" text-anchor="middle">BIOMES</textPath></text>
          <text id="label-anthromes" class="title"><textPath href="#arc-title-right" startOffset="50%" text-anchor="middle">ANTHROMES</textPath></text>

          <!-- Click targets for the titles. Same d= as the arcs above, kept in
               step by updateTitleArcs(); drawn after the text so they sit on
               top of it in hit-test order. Pointer targets only — they sit
               inside an aria-hidden layer, so they are deliberately not
               focusable; #enter below is the keyboard route in. -->
          <path id="hit-biomes"    class="title-hit"
                d="M -459.62 459.62 A 650 650 0 0 1 -459.62 -459.62" />
          <path id="hit-anthromes" class="title-hit"
                d="M 459.62 -459.62 A 650 650 0 0 1 459.62 459.62" />

          <text id="line-top"    class="line"><textPath href="#arc-line-top"    startOffset="50%" text-anchor="middle"></textPath></text>
          <text id="line-bottom" class="line"><textPath href="#arc-line-bottom" startOffset="50%" text-anchor="middle"></textPath></text>
        </svg>

        <div class="coin-wrap">
          <div class="coin" id="coin">
            <div class="face face--biomes">
              <img src="splash/biomes.webp" alt="Biomes visualization" />
              <div class="face-dim"></div>
              <svg class="face-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
                <defs>
                  <!-- Biomes dichotomy: TOP arc inside the face, letters outward. -->
                  <path id="face-arc-biomes" d="M -400 0 A 400 400 0 0 1 400 0" />
                  <!-- Definition arcs, used only once this side has been chosen.
                       r=440 and the same sweeps as loading.html, so the two
                       lines land exactly where the interstitial puts them. -->
                  <path id="def-arc-top-biomes" d="M -440 0 A 440 440 0 0 1 440 0" />
                  <path id="def-arc-bot-biomes" d="M -440 0 A 440 440 0 0 0 440 0" />
                </defs>
                <text id="biomes-text"><textPath href="#face-arc-biomes" startOffset="50%" text-anchor="middle"></textPath></text>
                <text id="def-top-biomes" opacity="0"><textPath href="#def-arc-top-biomes" startOffset="50%" text-anchor="middle"></textPath></text>
                <text id="def-bot-biomes" opacity="0"><textPath href="#def-arc-bot-biomes" startOffset="50%" text-anchor="middle"></textPath></text>
              </svg>
            </div>
            <div class="face face--anthromes">
              <img src="splash/anthromes.webp" alt="Anthromes visualization" />
              <div class="face-dim"></div>
              <svg class="face-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
                <defs>
                  <!-- Anthromes dichotomy: BOTTOM arc inside the face, letters inward. -->
                  <path id="face-arc-anthromes" d="M -400 0 A 400 400 0 0 0 400 0" />
                  <path id="def-arc-top-anthromes" d="M -440 0 A 440 440 0 0 1 440 0" />
                  <path id="def-arc-bot-anthromes" d="M -440 0 A 440 440 0 0 0 440 0" />
                </defs>
                <text id="anthromes-text"><textPath href="#face-arc-anthromes" startOffset="50%" text-anchor="middle"></textPath></text>
                <text id="def-top-anthromes" opacity="0"><textPath href="#def-arc-top-anthromes" startOffset="50%" text-anchor="middle"></textPath></text>
                <text id="def-bot-anthromes" opacity="0"><textPath href="#def-arc-bot-anthromes" startOffset="50%" text-anchor="middle"></textPath></text>
              </svg>
            </div>
          </div>
        </div>

        <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter the currently shown visualization"></div>
      </div>
    </div>
  </template>

  <!-- ===== Options 2+: the screen as it stood before the narrative pass ===== -->
  <template id="tpl-classic">
    <div class="splash splash--classic">
      <a id="leftLink"  class="sideLink" href="src/biomes/">BIOMES</a>
      <a id="rightLink" class="sideLink" href="src/anthromes/">ANTHROMES</a>

      <div class="disk-area">
        <svg class="caption-svg" viewBox="-500 -500 1000 1000" aria-hidden="true">
          <defs>
            <path id="arc-left"  d="M 0 -575 A 575 575 0 0 0 0 575" />
            <path id="arc-right" d="M 0 575 A 575 575 0 0 0 0 -575" />
          </defs>

          <!-- Biomes face captions -->
          <text id="cap-biomes-left" font-size="30">
            <textPath href="#arc-left" startOffset="50%" text-anchor="middle">AN EXTENSIVE HUMAN MICROBIOME</textPath>
          </text>
          <text id="cap-biomes-right" class="enter-text" font-size="30">
            <textPath href="#arc-right" startOffset="50%" text-anchor="middle">CLICK TO ENTER</textPath>
          </text>

          <!-- Anthromes face captions -->
          <text id="cap-anthromes-left" class="enter-text" font-size="30">
            <textPath href="#arc-left" startOffset="50%" text-anchor="middle">CLICK TO ENTER</textPath>
          </text>
          <text id="cap-anthromes-right" font-size="30">
            <textPath href="#arc-right" startOffset="50%" text-anchor="middle">MODELING 12,025 YEARS OF LAND USE</textPath>
          </text>
        </svg>

        <div class="coin-wrap">
          <div class="coin" id="coin">
            <div class="face face--biomes"><img src="splash/biomes.webp" alt="Biomes visualization" /></div>
            <div class="face face--anthromes"><img src="splash/anthromes.webp" alt="Anthromes visualization" /></div>
          </div>
        </div>

        <div class="enter" id="enter" role="button" tabindex="0" aria-label="Enter the currently shown visualization"></div>
      </div>
    </div>
  </template>

  <script type="module">
    // Controller: mounts whichever arrangement the shared UI option selects, and
    // hands the option list to the dev HUD so it can be cycled here the same way
    // it is on the two visualizations. Cloning a <template> rather than toggling
    // `display` keeps exactly one copy of each id in the document, which the
    // SVG textPath href="#..." references depend on.
    import { initPageStage } from './src/shared/pageStage.js';
    import { UI_OPTIONS, uiOption, cycleUiOption } from './src/shared/uiOption.svelte.js';
    import { mountNarrative } from './src/splash/narrative.js';
    import { mountClassic } from './src/splash/classic.js';

    const host = document.getElementById('splash-host');
    let teardown = null;

    function render() {
      teardown?.();
      // Option 1 is the narrative pass; every arrangement before it predates the
      // narrative splash and shares the original screen.
      const narrative = uiOption() === 1;
      const tpl = document.getElementById(narrative ? 'tpl-narrative' : 'tpl-classic');
      host.replaceChildren(tpl.content.cloneNode(true));
      teardown = (narrative ? mountNarrative : mountClassic)(host);
    }

    initPageStage({
      uiOptions: {
        labels: UI_OPTIONS,
        get: uiOption,
        cycle: () => { cycleUiOption(); render(); }
      }
    });

    // Both arrangements measure text to fit it to an arc, so wait for the face
    // rather than measuring fallback metrics and baking in the wrong size.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
    else render();
  </script>
</body>
</html>
